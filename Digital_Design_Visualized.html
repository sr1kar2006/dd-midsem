<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Design Visualized</title>
<style>:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel2:#f0eee8; --ink:#1d1f24; --muted:#5f6570; --line:#d9d6cc;
  --accent:#2f5bd3; --accent2:#b4481f; --accent-soft:#e7edfb;
  --sig1:#15a34a; --sig1glow:rgba(21,163,74,.35); --sig0:#9aa3b2; --sigx:#c99a2e;
  --gate:#fdfcf9; --gatestroke:#30343c;
  --key:#2f5bd3; --trap:#c2410c; --why:#7c3aed; --link:#0f766e; --exam:#be123c;
  --g0:#2563eb; --g1:#dc2626; --g2:#059669; --g3:#d97706; --g4:#7c3aed; --g5:#db2777; --g6:#0891b2; --g7:#65a30d;
  --code:#f3f1ea; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12141a; --panel:#1a1d25; --panel2:#222632; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2e3340;
  --accent:#7ea2ff; --accent2:#ff9a6b; --accent-soft:#1f2a45;
  --sig1:#4ade80; --sig1glow:rgba(74,222,128,.45); --sig0:#4b5363; --sigx:#e0b44a;
  --gate:#232733; --gatestroke:#c9ced9;
  --key:#7ea2ff; --trap:#fb923c; --why:#b794ff; --link:#2dd4bf; --exam:#fb7185;
  --g0:#60a5fa; --g1:#f87171; --g2:#34d399; --g3:#fbbf24; --g4:#a78bfa; --g5:#f472b6; --g6:#22d3ee; --g7:#a3e635;
  --code:#20242e; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;}
code,.mono,pre{font-family:"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
a{color:var(--accent)}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
#top .sp{flex:1}
#top button,.btn{font:inherit;font-size:14px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn:hover,#top button:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.pri{color:#0d1424}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
#menuBtn{display:none}
#wrap{display:flex;min-height:calc(100vh - 50px)}
#side{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto;padding:10px 8px 40px}
#side .part{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 10px 4px;font-weight:700}
#side a{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
#side a:hover{background:var(--panel2)}
#side a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
#side a .n{color:var(--muted);font-size:12px;min-width:22px}
#side a.done .n::after{content:" ✓";color:var(--sig1)}
#main{flex:1;min-width:0;padding:26px 36px 80px;max-width:1120px}
#main h2{font-size:30px;line-height:1.2;margin:.1em 0 .2em}
#main h3{font-size:21px;margin:1.8em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
#main h4{font-size:17px;margin:1.3em 0 .3em}
.kicker{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.lede{font-size:17.5px;color:var(--muted);margin:.3em 0 1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--link);color:var(--link)}
.chip.b{border-color:color-mix(in srgb,var(--link) 50%,var(--line))}
.box{border-left:4px solid var(--key);background:var(--panel);padding:10px 16px;border-radius:0 10px 10px 0;margin:14px 0;box-shadow:var(--shadow)}
.box>b:first-child{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.box.key{border-color:var(--key)} .box.key>b:first-child{color:var(--key)}
.box.trap{border-color:var(--trap)} .box.trap>b:first-child{color:var(--trap)}
.box.why{border-color:var(--why)} .box.why>b:first-child{color:var(--why)}
.box.link{border-color:var(--link)} .box.link>b:first-child{color:var(--link)}
.box.exam{border-color:var(--exam)} .box.exam>b:first-child{color:var(--exam)}
.box p{margin:.35em 0}
.w{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:18px 0;box-shadow:var(--shadow)}
.w .wt{font-weight:650;font-size:15px;margin-bottom:2px}
.w .ws{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.w svg{display:block;max-width:100%;height:auto;margin:0 auto}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ctl label{font-size:14px;color:var(--muted)}
.ctl input[type=text],.ctl select,.ctl input[type=number]{font:inherit;font-size:14px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.ctl input[type=text]{min-width:220px}
.out{font-size:14.5px;background:var(--panel2);border-radius:10px;padding:10px 14px;margin-top:8px;line-height:1.6}
.out:empty{display:none}
table.tt{border-collapse:collapse;font-size:14px;margin:8px 0}
table.tt th,table.tt td{border:1px solid var(--line);padding:3px 10px;text-align:center}
table.tt th{background:var(--panel2);font-weight:650}
table.tt tr.hl td{background:var(--accent-soft)}
table.tt td.one{color:var(--sig1);font-weight:700}
table.tt td.x{color:var(--sigx);font-weight:700}
table.tt tr.sep td{border-top:2px solid var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.eq{font-family:"Cambria Math","Cambria",Georgia,serif;font-size:18px;background:var(--panel2);padding:6px 12px;border-radius:8px;display:inline-block;margin:4px 0}
.eqb{display:block;text-align:center;font-family:"Cambria Math","Cambria",Georgia,serif;font-size:19px;margin:10px 0}
.ol{text-decoration:overline}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5;overflow:auto;margin:8px 0}
pre.code .kw{color:var(--accent);font-weight:600} pre.code .cm{color:var(--muted);font-style:italic} pre.code .nu{color:var(--accent2)} pre.code .sy{color:var(--why)}
pre.code .ln{display:block;border-radius:4px;padding:0 4px;margin:0 -4px}
pre.code .ln.hl{background:var(--accent-soft);outline:1px solid var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}
details summary{cursor:pointer;font-weight:600}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.navfoot a{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--panel);max-width:48%}
.navfoot a small{display:block;color:var(--muted)}
.pill{display:inline-block;padding:0 7px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid currentColor;margin:0 2px}
.hi1{color:var(--sig1);font-weight:700}.lo0{color:var(--sig0);font-weight:700}
.mut{color:var(--muted)}
.narr{min-height:3.2em;font-size:15px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);margin-top:8px}
.bitrow{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.bit{width:40px;text-align:center;cursor:pointer;user-select:none}
.bit .v{display:block;font:700 20px/38px Consolas,monospace;border:2px solid var(--line);border-radius:8px;background:var(--panel2)}
.bit .v.one{background:var(--sig1);color:#fff;border-color:var(--sig1)}
.bit .wgt{display:block;font-size:11.5px;color:var(--muted)}
.stat{display:inline-block;background:var(--panel2);border-radius:8px;padding:4px 10px;margin:3px;font-size:14px}
.stat b{font-family:Consolas,monospace;font-size:15.5px}
.legend{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin:0 4px 0 10px}
/* ===== circuit svg ===== */
svg .wire{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;transition:stroke .15s}
svg .wire.hi{stroke:var(--sig1);filter:drop-shadow(0 0 3px var(--sig1glow))}
svg .wire.lo{stroke:var(--sig0)}
svg .wire.x{stroke:var(--sigx);stroke-dasharray:4 4}
svg .body{fill:var(--gate);stroke:var(--gatestroke);stroke-width:2}
svg .body.act{stroke:var(--accent);stroke-width:2.6}
svg .bub{fill:var(--gate);stroke:var(--gatestroke);stroke-width:2}
svg text{fill:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
svg .lbl{font-size:13px;font-weight:600}
svg .sm{font-size:11px;fill:var(--muted)}
svg .pinv{font:700 11px Consolas,monospace}
svg .pinv.hi{fill:var(--sig1)} svg .pinv.lo{fill:var(--sig0)}
svg .sw{cursor:pointer}
svg .sw rect{stroke:var(--gatestroke);stroke-width:1.6}
svg .sw.hi rect{fill:var(--sig1)} svg .sw.lo rect{fill:var(--panel2)}
svg .sw text{font:700 13px Consolas,monospace}
svg .sw.hi text.v{fill:#fff}
svg .led{stroke:var(--gatestroke);stroke-width:1.6}
svg .led.hi{fill:var(--sig1);filter:drop-shadow(0 0 6px var(--sig1))} svg .led.lo{fill:var(--panel2)} svg .led.x{fill:var(--sigx)}
svg .dot{stroke:none}
svg .dot.hi{fill:var(--sig1)} svg .dot.lo{fill:var(--sig0)} svg .dot.x{fill:var(--sigx)}
svg .blk{fill:var(--gate);stroke:var(--gatestroke);stroke-width:2}
svg .dim{opacity:.35}
/* kmap */
svg .kcell{fill:var(--panel);stroke:var(--line);stroke-width:1.2;cursor:pointer}
svg .kcell:hover{fill:var(--accent-soft)}
svg .kcell.ess{stroke:var(--exam);stroke-width:2.4}
svg .kv{font:700 20px Consolas,monospace;pointer-events:none}
svg .kv.one{fill:var(--sig1)} svg .kv.zero{fill:var(--muted)} svg .kv.x{fill:var(--sigx)}
svg .kidx{font-size:9.5px;fill:var(--muted);pointer-events:none}
svg .grp{fill-opacity:.13;stroke-width:2.6;pointer-events:none}
/* state diagram */
svg .st{fill:var(--panel);stroke:var(--gatestroke);stroke-width:2}
svg .st.cur{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3.2}
svg .st.unused{stroke-dasharray:5 4;opacity:.8}
svg .edge{fill:none;stroke:var(--muted);stroke-width:1.8}
svg .edge.act{stroke:var(--accent);stroke-width:3.2}
svg .elbl{font:600 12px Consolas,monospace;fill:var(--ink)}
svg .elbl.act{fill:var(--accent)}
/* timing */
svg .wave{fill:none;stroke:var(--accent);stroke-width:2.2}
svg .wave.q{stroke:var(--sig1)}
svg .wave.bad{stroke:var(--trap)}
svg .tgrid{stroke:var(--line);stroke-width:1}
svg .tclick{fill:transparent;cursor:pointer}
svg .tclick:hover{fill:var(--accent-soft);fill-opacity:.6}
.kbd{font-family:Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
.cm-map{display:flex;flex-wrap:wrap;gap:10px}
.cm-card{flex:1 1 230px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);cursor:pointer}
.cm-card:hover{border-color:var(--accent)}
.cm-card h5{margin:0 0 4px;font-size:15px}
.cm-card p{margin:0;font-size:13.5px;color:var(--muted)}
@media (max-width:820px){
  #menuBtn{display:inline-block}
  #side{position:fixed;left:0;top:50px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #main{padding:18px 16px 60px}
  #main h2{font-size:24px}
}
table.tt{max-width:100%;overflow-x:auto;display:block;width:max-content}
.w{overflow-x:auto}
.ctl input[type=text]{max-width:100%}
.box{overflow-x:auto}
@media (max-width:820px){.eqb{font-size:16px;overflow-x:auto}}
</style></head>
<body><div id="top"><button id="menuBtn">☰</button><h1>Digital Design, Visualized <span class="mut" style="font-weight:400;font-size:13px">F215 · BITS Pilani</span></h1><span class="sp"></span><button id="themeBtn">◐ Light / Dark</button></div>
<div id="wrap"><nav id="side"></nav><main id="main"></main></div>
<script>
/* ================= CORE UTILITIES ================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);

}
function T(parent, x, y, txt, cls = 'lbl', extra = {}) {

function newSvg(host, w, h) {

}
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function toBits(v, w) { const a = []; for (let i = w - 1; i >= 0; i--) a.push((v >> i) & 1); return a; }
function bstr(v, w) { return toBits(v, w).join(''); }
function popc(x) { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; }

function range(n) { return [...Array(n).keys()]; }
function gray(n) { return n ^ (n >> 1); }
function grayInv(g) { let b = 0; for (; g; g >>= 1) b ^= g; return b; }
const VARS4 = ['A', 'B', 'C', 'D'];
function btn(label, fn, cls = '') { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; return b; }
function parseList(str) { // "0,2,3,5" or "0 2 3" -> numbers
  return (str.match(/\d+/g) || []).map(Number);
}
function parseSpec(str) { // "m(0,2,3)+d(5,6)" or "0,2,3 d 5,6"
  const s = str.replace(/\s+/g, '');
  let m = s, d = '';
  const di = s.search(/d/i);
  if (di >= 0) { m = s.slice(0, di); d = s.slice(di + 1); }
  return { ones: [...new Set(parseList(m))].sort((a, b) => a - b), dcs: [...new Set(parseList(d))].sort((a, b) => a - b) };
}

/* ================= BOOLEAN EXPRESSION PARSER =================
   Supports: A B C Q0 X1 ..., postfix ' (NOT), prefix ~ ! (NOT), implicit AND, * · . & (AND),
   + | (OR), ^ ⊕ (XOR), parentheses, constants 0 1.   Precedence: NOT > AND > XOR > OR */

    if (/\s/.test(c)) { i++; continue; }

    if (c === '0' || c === '1') { toks.push({ t: 'c', v: +c }); i++; continue; }
    if ("+|".includes(c)) { toks.push({ t: 'or' }); i++; continue; }
    if ("*·.&".includes(c)) { toks.push({ t: 'and' }); i++; continue; }
    if ("^⊕".includes(c)) { toks.push({ t: 'xor' }); i++; continue; }
    if ("~!".includes(c)) { toks.push({ t: 'not' }); i++; continue; }
    if (c === "'") { toks.push({ t: 'post' }); i++; continue; }
    if (c === '(') { toks.push({ t: '(' }); i++; continue; }

function parseExpr(str) {

  const peek = () => tk[p], eat = t => { if (!tk[p] || tk[p].t !== t) throw new Error('Expected ' + t); return tk[p++]; };
  function orE() { let a = xorE(); while (peek() && peek().t === 'or') { p++; a = { op: 'or', a, b: xorE() }; } return a; }

  function startsFactor(t) { return t && (t.t === 'id' || t.t === 'c' || t.t === '(' || t.t === 'not'); }

function astVars(e, s = new Set()) { if (e.op === 'var') s.add(e.v); if (e.a) astVars(e.a, s); if (e.b) astVars(e.b, s); return s; }

function exprFn(str, vars) { // returns f(index) with vars[0] = MSB
  const ast = parseExpr(str); const vs = vars || sortVars(astVars(ast));
  return { vars: vs, f: idx => { const env = {}; vs.forEach((v, i) => env[v] = (idx >> (vs.length - 1 - i)) & 1); return evalAst(ast, env); } };
}
function exprMinterms(str, vars) { const { vars: vs, f } = exprFn(str, vars); return { vars: vs, ones: range(1 << vs.length).filter(i => f(i)) }; }

/* ================= QUINE-McCLUSKEY + COVER ================= */
// implicant: {v: value bits, d: dash mask}
function covers(p, m) { return (m & ~p.d) === p.v; }
function impKey(p) { return p.v + ':' + p.d; }
function litCount(p, n) { return n - popc(p.d); }
function termStr(p, vars, pos = false) {
  const n = vars.length; const lits = [];

    const bit = n - 1 - i; if ((p.d >> bit) & 1) continue;

function qmSteps(n, ones, dcs) {
  let cur = new Map();
  [...new Set([...ones, ...dcs])].sort((a, b) => a - b).forEach(m => cur.set(m + ':0', { v: m, d: 0, ms: [m], used: false }));
  const columns = []; const primes = [];
  while (cur.size) {
    const arr = [...cur.values()]; columns.push(arr);
    const next = new Map();
    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {

class Timing {

  }
  draw() {
    const o = this.o; this.host.innerHTML = '';
    const N = o.steps, W = this.lw + N * this.cw + 14, H = o.signals.length * this.rh + 26;
    const svg = newSvg(this.host, W, H);
    for (let i = 0; i <= N; i++) S('line', { x1: this.lw + i * this.cw, y1: 4, x2: this.lw + i * this.cw, y2: H - 20, class: 'tgrid', 'stroke-dasharray': '2 4' }, svg);
    (o.marks || []).forEach(m => { const x = this.lw + m.at * this.cw; S('line', { x1: x, y1: 2, x2: x, y2: H - 18, style: 'stroke:var(--accent);stroke-width:1.2;opacity:.55' }, svg); if (m.label) T(svg, x, H - 5, m.label, 'sm', { 'text-anchor': 'middle' }); });
    if (o.bands) o.bands.forEach(b => S('rect', { x: this.lw + b.from * this.cw, y: 2, width: (b.to - b.from) * this.cw, height: H - 22, style: `fill:${b.color || 'var(--trap)'};opacity:.1` }, svg));
    o.signals.forEach((s, k) => {
      const y0 = k * this.rh + 8, hi = y0 + 6, lo = y0 + this.rh - 16;
      T(svg, this.lw - 10, (hi + lo) / 2 + 5, s.name, 'lbl', { 'text-anchor': 'end' });
      let d = ''; let prev = null;
      s.vals.forEach((v, i) => {
        const x0 = this.lw + i * this.cw, x1 = x0 + this.cw;
        if (v === null || v === 'x' || v === undefined) { S('rect', { x: x0, y: hi, width: this.cw, height: lo - hi, style: 'fill:var(--sigx);opacity:.25' }, svg); d += `M${x0},${hi} H${x1} M${x0},${lo} H${x1} `; prev = null; return; }
        const y = v ? hi : lo;
        if (prev === null) d += `M${x0},${y} `; else if (prev !== v) d += `L${x0},${y} `;
        d += `L${x1},${y} `; prev = v;
      });

      if (s.editable) s.vals.forEach((v, i) => {

    });
  }
}

/* ================= SEQUENCE DETECTOR GENERATOR ================= */
function seqDetector(pat, overlap, moore) {
  const L = pat.length;
  const lsp = (t, max) => { for (let len = Math.min(t.length, max); len > 0; len--) if (t.slice(-len) === pat.slice(0, len)) return len; return 0; };
  const st = [], tr = {};
  const nS = moore ? L + 1 : L;
  for (let k = 0; k < nS; k++) {
    st.push({ id: k, seen: pat.slice(0, k), out: moore ? (k === L ? 1 : 0) : null });
    tr[k] = {};
    for (const b of ['0', '1']) {
      if (!moore) {
        const t = pat.slice(0, k) + b;
        if (t === pat) tr[k][b] = [overlap ? lsp(t.slice(1), L - 1) : 0, 1];
        else tr[k][b] = [lsp(t, L - 1), 0];
      } else {
        if (k < L) { const t = pat.slice(0, k) + b; tr[k][b] = [t === pat ? L : lsp(t, L - 1), 0]; }
        else { const t = pat + b; tr[k][b] = [overlap ? lsp(t.slice(1), L) : lsp(b, L), 0]; }
      }
    }
  }
  return { states: st, tr, L, moore };
}

/* ================= FSM DESIGN PIPELINE =================
   spec: { nb, stBits:[names MSB first], ins:[names], outs:[names], ffs:[type per bit], next(code, inIdx) -> {ns, out:[..]} | null (unused) } */

  const fnames = [];
  stBits.forEach((b, j) => ffInNames(ffs[j], b).forEach(f => { fnames.push(f); funcs[f] = { ones: [], dcs: [], bit: j, type: ffs[j] }; }));
  outs.forEach(o => { fnames.push(o); funcs[o] = { ones: [], dcs: [] }; });
  for (let ps = 0; ps < (1 << nb); ps++) for (let x = 0; x < (1 << ni); x++) {
    const idx = (ps << ni) | x; const r = spec.next(ps, x);
    if (!r) { fnames.forEach(f => funcs[f].dcs.push(idx)); rows.push({ ps, x, unused: true }); continue; }
    const row = { ps, x, ns: r.ns, out: r.out || [], fi: {} };
    stBits.forEach((b, j) => {
      const q = (ps >> (nb - 1 - j)) & 1, qn = (r.ns >> (nb - 1 - j)) & 1;
      const e = FF[ffs[j]].exc(q, qn); const nm = ffInNames(ffs[j], b);
      FF[ffs[j]].ins.forEach((k, t) => { const v = e[k]; row.fi[nm[t]] = v; if (v === 1) funcs[nm[t]].ones.push(idx); else if (v === 'X') funcs[nm[t]].dcs.push(idx); });
    });
    outs.forEach((o, t) => { const v = row.out[t]; if (v === 1) funcs[o].ones.push(idx); else if (v === 'X' || v === null) funcs[o].dcs.push(idx); });
    rows.push(row);
  }
  fnames.forEach(f => { const r = minimize(n, funcs[f].ones, funcs[f].dcs); funcs[f].sol = r.solutions[0]; funcs[f].expr = sopStr(r.solutions[0], vars); funcs[f].lits = totalLits(r.solutions[0], n); });

    const idx = (r.ps << ni) | r.x; let ns = 0;

      let qn = FF[ffs[j]].next(iv, q); if (qn === null) qn = q; ns |= qn << (nb - 1 - j);

    h += `<tr${sep}>${toBits(r.ps, nb).map(b => `<td>${b}</td>`).join('')}${toBits(r.x, ni).map(b => `<td>${b}</td>`).join('')}${toBits(r.ns, nb).map(b => `<td>${b}</td>`).join('')}${fiCols.map(f => { const v = r.fi[f]; return `<td class="${v === 1 ? 'one' : v === 'X' ? 'x' : ''}">${v}</td>`; }).join('')}${outs.map((_, t) => `<td class="${r.out[t] === 1 ? 'one' : ''}">${r.out[t]}</td>`).join('')}</tr>`;

function bitToggler(host, n, onchg, init = 0) {
  const row = el('<div class="bitrow"></div>'); host.appendChild(row);
  const st = { v: init, n };
  const draw = () => {
    row.innerHTML = '';
    for (let i = n - 1; i >= 0; i--) {
      const b = (st.v >> i) & 1;
      const d = el(`<div class="bit"><span class="wgt">2<sup>${i}</sup></span><span class="v ${b ? 'one' : ''}">${b}</span><span class="wgt">${1 << i}</span></div>`);
      d.onclick = () => { st.v ^= (1 << i); draw(); onchg(st.v); };
      row.appendChild(d);
    }
  };
  st.set = v => { st.v = v; draw(); onchg(v); };
  draw(); onchg(st.v); return st;
}

<h3>1. Positional notation: what a digit is worth</h3>
<p>In decimal, <b>725</b> means 7×100 + 2×10 + 5×1. Each position is worth 10 times the one to its right. Binary is the same idea with 2 instead of 10: each position (a <b>bit</b>) is worth <b>twice</b> the one on its right, and each bit can only be 0 or 1.</p>
<p class="eqb">(b<sub>n-1</sub> … b<sub>1</sub> b<sub>0</sub>)<sub>2</sub> = b<sub>n-1</sub>·2<sup>n-1</sup> + … + b<sub>1</sub>·2 + b<sub>0</sub>·1</p>

<h3>2. Hexadecimal and octal: shorthand for long bit strings</h3>
<p>Since 16 = 2<sup>4</sup>, one hex digit is exactly 4 bits. Since 8 = 2<sup>3</sup>, one octal digit is exactly 3 bits. So converting binary ↔ hex/octal needs no arithmetic: group the bits <b>starting from the right (the binary point)</b> and translate each group. Hex digits after 9 are A=10, B=11, C=12, D=13, E=14, F=15.</p>
${box('trap', 'Edge case', `<p>Always group from the <b>right</b>. 1011010 in octal is 1 | 011 | 010 = 132<sub>8</sub>, not 101 | 101 | 0. Pad the leftmost group with zeros. For fractions, group from the binary point going <b>right</b> and pad at the far right.</p>`)}

<h3>3. Decimal → binary: repeated division by 2</h3>
<p>Dividing by 2 shifts the number one place right; the remainder is the bit that fell off (the current LSB). Keep dividing: the remainders are the bits from <b>LSB to MSB</b>, so you read them bottom-up.</p>
${W('w-div', 'Watch the division method', 'Type a decimal number and step through. Each remainder is one bit.')}
<p>Fractions work the other way: <b>multiply by 2</b>, the integer part that pops out is the next bit after the point. 0.625 → 1.25 (1) → 0.5 (0) → 1.0 (1), so 0.625 = 0.101<sub>2</sub>. Some fractions (like 0.1) never end in binary.</p>

<h3>4. Binary addition, the operation everything is built on</h3>
<p>Adding in binary is column addition exactly like school, with only four facts: 0+0=0, 0+1=1, 1+1=<b>10</b> (write 0, carry 1), 1+1+1=<b>11</b> (write 1, carry 1). The carry is what makes adders interesting (and slow) in hardware.</p>

  id: 'signed', part: 'Part 1 · Working in Binary', title: 'Negative numbers, 2\'s complement and overflow',

  builds: ['numbers'], leads: ['rca', 'adders'],
  html: `
<h3>1. Three ways to write negative numbers</h3>
<ul>
<li><b>Sign-magnitude:</b> MSB is the sign (1 = negative), remaining bits are the size. Easy to read, but has two zeros (+0 = 0000, −0 = 1000) and adding needs special cases.</li>
<li><b>1's complement:</b> to negate, flip every bit. Still two zeros (0000 and 1111).</li>
<li><b>2's complement:</b> to negate, flip every bit <b>and add 1</b>. One zero, and ordinary binary addition just works. <b>This is what all hardware (and this course) uses.</b></li>
</ul>
${W('w-int', 'One bit pattern, three meanings', 'Click bits. The same 8 wires mean different numbers depending on the agreed representation. The hardware does not know; only you do.')}
${box('key', 'The one idea that explains 2\'s complement', `<p>In n-bit 2's complement the MSB has weight <b>−2<sup>n-1</sup></b> instead of +2<sup>n-1</sup>. Everything else is normal. For 4 bits: 1011 = −8 + 0 + 2 + 1 = <b>−5</b>. For 8 bits: 11111111 = −128 + 127 = <b>−1</b>.</p><p>Range of n bits: <b>−2<sup>n-1</sup> to +2<sup>n-1</sup>−1</b>. 3 bits: −4…+3. 4 bits: −8…+7. 8 bits: −128…+127. There is one more negative number than positive.</p>`)}
${box('trap', 'Edge cases examiners love', `<p><b>Negating the most negative number fails.</b> In 4 bits, −8 = 1000. Flip → 0111, add 1 → 1000 = −8 again. +8 does not exist in 4 bits.</p><p><b>Shortcut to negate:</b> copy bits from the right up to and including the first 1, then flip everything to its left. 0110100 → 1001100.</p><p><b>Sign extension:</b> to widen a 2's complement number, copy the MSB into the new bits. −3 = 1101 (4 bits) = 11111101 (8 bits). Padding with 0 would turn it into +13.</p>`)}

<h3>2. The number wheel: why overflow happens</h3>
<p>With n bits the patterns form a <b>circle</b>: after 1111 comes 0000 again (the lost carry). Adding B means walking B steps clockwise; subtracting means walking counter-clockwise. The same walk has two different meanings depending on how you read the labels:</p>
<ul>
<li>Read as <b>unsigned</b> (inner numbers): the answer is wrong when you cross the <span style="color:var(--g0);font-weight:700">blue line</span> between 1111 and 0000. Crossing it going forward is exactly when the adder produces <b>carry-out = 1</b>.</li>
<li>Read as <b>signed</b> (outer numbers): the answer is wrong when you cross the <span style="color:var(--g1);font-weight:700">red line</span> between +max (0111) and −min (1000). That is <b>signed overflow V</b>.</li>
</ul>
${W('w-wheel', 'The overflow wheel', 'Pick the width, A, B and the operation, then press Walk. The walk animates one step per unit.')}
${box('key', 'Overflow rules to memorise (and understand from the wheel)', `<p><b>Unsigned addition:</b> result wrong ⇔ carry-out C<sub>n</sub> = 1.</p><p><b>Unsigned subtraction A − B</b> (done as A + B' + 1): result wrong ⇔ C<sub>n</sub> = <b>0</b>. The carry is an inverted borrow: C<sub>n</sub> = 1 means A ≥ B. This inversion catches many students.</p><p><b>Signed (2's complement) add or subtract:</b> overflow ⇔ both numbers actually being added have the same sign and the result has the other sign. In hardware: <b>V = C<sub>n-1</sub> ⊕ C<sub>n</sub></b> (carry into the MSB XOR carry out of it).</p><p><b>Adding a positive and a negative number can never overflow</b>: the result lies between them.</p>`)}
${box('why', 'Why V = C<sub>n-1</sub> ⊕ C<sub>n</sub>', `<p>Look only at the sign column. Both inputs positive (0,0): a carry in (C<sub>n-1</sub>=1) makes the sign bit 1 (negative!) and C<sub>n</sub>=0 → mismatch → overflow. Both negative (1,1): C<sub>n</sub> is always 1; if C<sub>n-1</sub>=0 the sign becomes 0 (positive!) → mismatch → overflow. Mixed signs (0,1): C<sub>n</sub> always equals C<sub>n-1</sub> → never overflow. So "carries disagree" is exactly "overflow".</p>`)}
${box('exam', 'Exam lens', `<p>Quiz 2 Q5 and Tutorial 3 Q2 are the same idea: given some correct and some wrong adder outputs, find the bit-width. Wrong outputs are the true answer "wrapped around the wheel". The chapter <span class="chip" data-go="rca">Ripple-carry adder and adder/subtractor</span> has a detective tool for exactly this.</p>`)}

  id: 'codes', part: 'Part 1 · Working in Binary', title: 'Binary codes: BCD, Excess-3, Gray, parity',
  lede: 'A code is just an agreed table between symbols and bit patterns. Different codes are chosen for different jobs: easy decimal display (BCD), easy complements (Excess-3), glitch-free position sensing (Gray), error detection (parity).',
  builds: ['numbers'], leads: ['kmap', 'bcd', 'encoder', 'systems'],
  html: `
<h3>1. BCD (Binary Coded Decimal, 8421 code)</h3>
<p>Each decimal digit is written separately as a 4-bit binary number. 4 bits give 16 patterns but a digit needs only 10, so <b>1010 to 1111 are never used</b> in BCD.</p>
<p>Example: 59 in binary is 111011 (6 bits), but in BCD it is <b>0101 1001</b> (8 bits, one nibble per digit). BCD wastes bits but makes decimal displays and decimal arithmetic easy.</p>
${W('w-bcd', 'Decimal → BCD → Excess-3', 'Type a decimal number. Each digit becomes its own 4-bit group.')}
${box('key', 'The six unused patterns are free don\'t-cares', `<p>If a circuit's input is a BCD digit, inputs 1010 to 1111 (decimal 10 to 15) <b>can never occur</b>. So in the K-map you mark minterms 10, 11, 12, 13, 14, 15 as <b>X (don't care)</b>. This is exactly what the midsem "prime number detector on a BCD digit" question expects: Z = Σm(2,3,5,7) + d(10,11,12,13,14,15).</p>`)}
<h3>2. Excess-3 code</h3>
<p>Digit n is written as the 4-bit binary of <b>n + 3</b>. So 0 → 0011, 5 → 1000, 9 → 1100 (lecture 11). Why would anyone do this? Because it is <b>self-complementing</b>: flipping all bits of the code for n gives the code for 9 − n. That makes 9's complement (used in decimal subtraction) just a row of inverters.</p>
${W('w-x3', 'Self-complementing property', 'Pick a digit. Flip all bits of its Excess-3 code and see which digit you land on.')}
${box('link', 'Connection', `<p>The BCD → Excess-3 converter is the first full design example of lecture 11: 4 inputs, 4 outputs, 6 don't-cares, one K-map per output. You will build it in <span class="chip" data-go="bcd">BCD adder and code converters</span>.</p>`)}

<h3>3. Gray code: only ONE bit changes between neighbours</h3>
<p>In ordinary binary, going from 3 (011) to 4 (100) changes all three bits at once. In a real sensor the three bits never change at <i>exactly</i> the same instant, so for a moment the reading can be anything (111, 000, 101, …). <b>Gray code</b> orders the patterns so that consecutive values differ in exactly one bit, <b>including the wrap from the last back to the first</b>. Then a reading taken during a transition is always either the old value or the new one, never garbage.</p>
${W('w-refl', 'How Gray code is built: reflect and prefix', 'Press Next. Start with 0,1. To go from n to n+1 bits: copy the list, mirror it underneath, put 0 in front of the top half and 1 in front of the mirrored half.')}

<h4>Converting binary ↔ Gray with XOR gates</h4>
<p><b>Binary → Gray:</b> keep the MSB, then each Gray bit is the XOR of two neighbouring binary bits: g<sub>i</sub> = b<sub>i+1</sub> ⊕ b<sub>i</sub>. (XOR = "are these two different?". A Gray bit is 1 exactly where the binary number changes from one bit to the next.)</p>
<p><b>Gray → Binary:</b> keep the MSB, then each binary bit is the XOR of the binary bit above it and the Gray bit: b<sub>i</sub> = b<sub>i+1</sub> ⊕ g<sub>i</sub>. Notice this one is a <b>chain</b>: b<sub>1</sub> needs b<sub>2</sub> first, so the XORs cascade.</p>
<div class="grid2"><div>${W('w-b2g', 'Binary → Gray (parallel XORs)')}</div><div>${W('w-g2b', 'Gray → Binary (cascaded XORs)')}</div></div>

<h3>4. Parity: detecting a single flipped bit</h3>
<p>Add one extra bit P so that the total number of 1s is even (<b>even parity</b>) or odd (<b>odd parity</b>). The receiver counts the 1s again. If one bit flipped on the way, the count's parity is wrong and the error is detected.</p>

${box('key', 'Controlling values (use these constantly)', `<p><b>AND:</b> A·0 = 0, A·1 = A. So an AND gate with one input = 1 just passes the other input through; with one input = 0 it is "blocked". This is how an <b>enable</b> works.</p><p><b>OR:</b> A+1 = 1, A+0 = A.</p><p><b>XOR:</b> A⊕0 = A, A⊕1 = A'. So XOR is a <b>programmable inverter</b>: this is how one adder circuit also subtracts.</p>`)}

<h3>2. Boolean algebra: the rules</h3>
<p>Boolean algebra has only two values, and three basic operations: AND (·, often written by just putting letters together: AB), OR (+) and NOT (' or an overbar). Precedence is <b>NOT first, then AND, then OR</b>, exactly like ×-before-+ in normal algebra. So AB' + C means (A·(B')) + C.</p>
<table class="tt" style="font-size:15px"><tr><th>#</th><th>Law</th><th>OR form</th><th>AND form (dual)</th><th></th></tr>
<tr><td>1</td><td>Identity</td><td>x + 0 = x</td><td>x · 1 = x</td><td></td></tr>
<tr><td>2</td><td>Complement</td><td>x + x' = 1</td><td>x · x' = 0</td><td></td></tr>
<tr><td>3</td><td>Idempotent</td><td>x + x = x</td><td>x · x = x</td><td></td></tr>
<tr><td>4</td><td>Null (domination)</td><td>x + 1 = 1</td><td>x · 0 = 0</td><td></td></tr>
<tr><td>5</td><td>Involution</td><td colspan="2">(x')' = x</td><td></td></tr>
<tr><td>6</td><td>Commutative / Associative</td><td>x + y = y + x</td><td>x(yz) = (xy)z</td><td></td></tr>
<tr><td>7</td><td>Distributive</td><td>x(y + z) = xy + xz</td><td><b>x + yz = (x + y)(x + z)</b></td><td><button class="btn" data-eq="x+yz|(x+y)(x+z)">verify</button></td></tr>
<tr><td>8</td><td>Absorption</td><td>x + xy = x</td><td>x(x + y) = x</td><td><button class="btn" data-eq="x+xy|x">verify</button></td></tr>
<tr><td>9</td><td>"Redundant literal"</td><td>x + x'y = x + y</td><td>x(x' + y) = xy</td><td><button class="btn" data-eq="x+x'y|x+y">verify</button></td></tr>
<tr><td>10</td><td>De Morgan</td><td>(x + y)' = x'y'</td><td>(xy)' = x' + y'</td><td><button class="btn" data-eq="(xy)'|x'+y'">verify</button></td></tr>
<tr><td>11</td><td>Consensus</td><td>xy + x'z + yz = xy + x'z</td><td>(x+y)(x'+z)(y+z) = (x+y)(x'+z)</td><td><button class="btn" data-eq="xy+x'z+yz|xy+x'z">verify</button></td></tr>
</table>
${W('w-eq', 'Equivalence checker (your algebra calculator)', 'Type any two expressions. Letters (with optional digits: Q0, X1) are variables. Use \' or ~ for NOT, + for OR, juxtaposition or * for AND, ^ for XOR. Press a "verify" button above to load a law.')}
${box('why', 'Understand the tricky laws instead of memorising them', `<p><b>Absorption x + xy = x:</b> if x = 1 both sides are 1. If x = 0, xy is also 0, so both sides are 0. The term xy adds nothing: whenever it is 1, x was already 1.</p><p><b>x + x'y = x + y:</b> the x' inside x'y is pointless. The term x'y only matters when x = 0, and then x' = 1 anyway.</p><p><b>Second distributive law x + yz = (x+y)(x+z):</b> it looks wrong because it is not true for numbers. In Boolean algebra it is true: expand the right side: xx + xz + xy + yz = x(1 + z + y) + yz = x + yz.</p><p><b>Consensus:</b> yz is redundant because whenever y = z = 1, either x = 1 (then xy = 1) or x = 0 (then x'z = 1). On a K-map, yz is a group that lies entirely inside the other two groups.</p>`)}
${box('trap', 'Classic mistakes', `<p>(AB)' is <b>not</b> A'B'. It is A' + B' (De Morgan: break the bar, change the operator).</p><p>A + B' is not the same as (A + B)'.</p><p>Tutorial 3's "mystery" module: f = pqr + q + s. By absorption q + pqr = q, so f = q + s. <b>p and r have no effect at all.</b> Always look for absorption before drawing gates.</p>`)}

<h3>3. De Morgan as a picture: moving bubbles</h3>
<p>De Morgan says <b>(AB)' = A' + B'</b>. In gate symbols: a NAND gate is exactly the same thing as an OR gate with bubbles on its inputs. Likewise NOR = AND with inverted inputs. Flip the switches below: the two lamps always agree.</p>
${W('w-dm', 'Two drawings, one behaviour', 'Top pair: NAND vs "bubbled-input OR". Bottom pair: NOR vs "bubbled-input AND".')}
${box('link', 'Why you care', `<p>This picture is the whole trick behind converting AND-OR circuits into NAND-only circuits (bubble pushing) in <span class="chip" data-go="nandnor">NAND/NOR implementation</span>, and behind active-low decoders and enables.</p>`)}
<p><b>Duality:</b> swap every + with ·, and every 0 with 1 (leave variables alone). If an identity is true, its dual is also true. That is why the table has two columns.</p>

<h3>4. Seeing expressions as regions (Venn view)</h3>
<p>Each variable is a circle ("inside = 1"). An expression is 1 in some regions and 0 in others. With 3 variables there are exactly 8 regions, one for each input combination. Keep this picture in mind: those 8 regions are the 8 <b>minterms</b> of the next chapter.</p>

<table class="tt mono" style="font-size:15px"><tr><th>AB \\ CD</th><th>00</th><th>01</th><th>11</th><th>10</th></tr><tr><th>00</th><td>0</td><td>1</td><td>3</td><td>2</td></tr><tr><th>01</th><td>4</td><td>5</td><td>7</td><td>6</td></tr><tr><th>11</th><td>12</td><td>13</td><td>15</td><td>14</td></tr><tr><th>10</th><td>8</td><td>9</td><td>11</td><td>10</td></tr></table>
<p>Columns 3 and 4 are swapped, rows 3 and 4 are swapped. If a question draws the map with a different variable arrangement (e.g. rows CD, columns AB, or 3-variable with rows AB and column C), <b>re-derive the numbers</b> from the headers every time.</p>`)}

<h3>2. Rules for a legal group</h3>
<ul>
<li>A group is a <b>rectangle</b> (it may wrap around the edges) containing only 1s (or X's).</li>
<li>Its size must be a <b>power of 2</b>: 1, 2, 4, 8, 16. A group of 2<sup>k</sup> cells eliminates k variables.</li>
<li>Reading a group: the variables that stay <b>constant</b> over the whole group survive (0 → primed, 1 → plain). Variables that change inside the group vanish.</li>
<li>Groups may overlap. Use the biggest groups possible and the fewest groups possible.</li>
</ul>
${W('w-pick', 'Is this a legal group? (click cells to select)', 'Select any set of cells. The checker tells you whether it is a legal group and which product term it stands for, or why it is illegal.')}

<h3>3. Prime implicants and essential prime implicants</h3>
<p><b>Implicant:</b> any legal group of 1s (and X's). <b>Prime implicant (PI):</b> a group that cannot be made bigger (it is not contained in any larger legal group). Only PIs are ever worth using, because a bigger group always means fewer literals.</p>
<p><b>Essential prime implicant (EPI):</b> a PI that covers at least one 1 that <b>no other PI</b> covers. Such a PI must appear in every minimal answer, so you take it first.</p>
<p><b>The procedure</b> (what the "Teach me" button walks through):</p>
<ol><li>Find all PIs.</li><li>Mark the EPIs (look for 1s covered by only one PI).</li><li>Cover whatever 1s remain using the fewest additional PIs (prefer larger ones).</li></ol>
${W('w-km', 'The K-map workbench', 'Click cells to cycle 0 → 1 → X. Use the presets from your exams, then press "Teach me step by step". Hover a PI chip to see only that group.')}
${box('key', 'Why "all PIs" matters in your exam', `<p>Quiz 2 Q2 asked to list the PIs and tick which are essential, with "−1 per extra term". A non-essential PI still has to be listed as a PI. And a group that is not prime (could be enlarged) is <b>not</b> a PI, so listing it loses marks.</p><p>Also: a 1 covered by several PIs does not make any of them essential. Only 1s with a <i>single</i> covering PI count. A cell that is X never makes a PI essential.</p>`)}
${box('trap', 'Edge cases to be careful with', `<p><b>Corners:</b> in a 4-variable map, the four corners (0, 2, 8, 10) form one group of 4 = B'D'. Easy to miss.</p><p><b>Cyclic maps:</b> sometimes every 1 is covered by two PIs and there is no EPI (try the "cyclic" preset). Then there are several equally minimal answers. The exam may ask for "all minimum SOP forms".</p><p><b>Redundant PIs:</b> a PI whose cells are all covered by EPIs is not needed (e.g. the consensus term). Using it is not wrong logically but is not minimal.</p><p><b>Groups of X only</b> are never drawn: they add a term that covers no required 1.</p>`)}

<h3>4. Don't-care conditions</h3>
<p>A don't-care (X, or d) is an input for which you do not care what the output is, because it never happens (invalid BCD codes, unused states of a counter) or because the output is ignored then (the lighthouse facing land; the prime output when the parity check fails). On the map you may treat each X as 1 <b>if that makes a group bigger</b>, and as 0 otherwise. Each X is decided independently.</p>
${box('exam', 'Exam lens: the BCD prime detector (Midsem 2024 Q3)', `<p>Z = 1 for BCD inputs 2, 3, 5, 7. Inputs 10 to 15 cannot occur → X. Load the "BCD prime" preset above and press Teach me. Without the X's the answer is P'Q'R + P'QS; with them it collapses to <b>Q'R + QS</b>. The question also asked for "all minimum SOP forms" and a 2-input NAND realisation, so you need the PI list, not just one answer.</p>`)}

<h3>5. POS: grouping the 0s</h3>
<p>Group the <b>0s</b> instead of the 1s. That gives a minimal SOP for <b>F'</b> (because F' is 1 exactly where F is 0). Then apply De Morgan to the whole thing: every product term becomes a sum term with each literal complemented.</p>
<p>Lecture 10 example: F = Σm(0,1,2,5,8,9,10). Grouping the 0s gives F' = AB + CD + BD', so <b>F = (A' + B')(C' + D')(B' + D)</b>. Load "Lecture POS" and press "Group the 0s".</p>
${W('w-msp', 'Minimal SOP vs minimal POS: are they always the same function?', 'With don\'t-cares, the two answers may use the X cells differently. This tool computes both and checks every X cell.')}
${box('why', 'Tutorial 4 Q1 in one sentence', `<p>Without don't-cares, MSP and MPS describe exactly the same function (they are just two ways of writing one truth table). <b>With don't-cares they may differ</b>, because the SOP decided some X's were 1 and the POS decided some of those same X's were 0. Both are correct implementations of the specification, but they are not equal as Boolean functions. So never "check" a POS by expanding it and comparing with your SOP when X's are present.</p>`)}

<h3>6. Five-variable maps</h3>
<p>Five variables need 32 cells. Draw <b>two 4-variable maps</b>, one for A = 0 and one for A = 1. Groups work inside each map as usual, and a cell is also adjacent to the cell in the <b>same position in the other map</b> (they differ only in A). A group that appears in the same place in both maps loses A. (The comprehensive exam hint said exactly this: "5-variable K-maps can be simplified as two 4-variable K-maps and then combined".)</p>

CH.push({
  id: 'qm', part: 'Part 1 · Working in Binary', title: 'Quine-McCluskey: the tabular method',
  lede: 'The K-map procedure turned into a table-filling algorithm. It does not depend on your eyes spotting groups, so it works for any number of variables (and is how computers minimise logic).',
  builds: ['kmap'], leads: ['pld'],
  html: `
<h3>1. The idea is identical to the K-map</h3>
<p>The K-map merges two cells that differ in one variable. Quine-McCluskey (QM) does the same merge by comparing bit strings: 0101 and 0111 differ only in the second-last position, so they merge into <b>01-1</b> (the dash marks the eliminated variable). Keep merging until nothing merges. Whatever never merged is a prime implicant.</p>
<h3>2. The steps</h3>
<ol>
<li><b>List</b> all minterms <b>and don't-cares</b> in binary, grouped by the number of 1s they contain. (Only neighbouring groups can differ in exactly one bit, so you only compare group k with group k+1.)</li>
<li><b>Merge</b>: for every pair from adjacent groups that differ in exactly one bit, write the merged term with a dash, and tick both parents. Dashes must be in the <b>same positions</b> to merge in later columns.</li>
<li>Repeat on the new column until no merges are possible. Remove duplicates (the same term can appear from two different pairs).</li>
<li><b>Unticked terms are the prime implicants.</b></li>
<li><b>PI chart</b>: rows = PIs, columns = the required minterms only (<b>not</b> the don't-cares). Put an X where a PI covers a minterm.</li>
<li>A column with a single X → that row is an <b>essential PI</b>. Take it, and cross out all columns it covers. Cover what remains with the fewest remaining PIs.</li>
</ol>
${W('w-qm', 'Quine-McCluskey, step by step', 'Enter minterms and don\'t-cares (4 or 5 variables). Preset is the comprehensive exam question F = Σm(1,3,4,5,9,10,11) + Σd(6,8).')}
${box('trap', 'Edge cases in QM', `<p><b>Don't-cares join the merging but not the chart.</b> Using them in step 1 lets groups grow; leaving them out of the chart means you never have to cover them.</p><p><b>Only compare terms whose dashes are in the same place.</b> 01-1 and 0--1 cannot merge.</p><p>The same merged term appears twice in column 3 (from two different pairs). Write it once.</p><p>A term is ticked if it merged <b>with anything</b>. A term can be ticked and still have been used in several merges.</p>`)}
${box('exam', 'Exam lens', `<p>Comprehensive 2025 Q6 asked you to "tabulate the PI chart" and write "the minterm in terms of appropriate literals" (e.g. the PI 0-01 is written A'C'D). Practise converting dash strings to literals: position of a dash = variable gone; 1 = plain; 0 = primed.</p>`)}
`,
  init(root) {
    const w = mount(root, 'w-qm');
    const c = el('<div class="ctl"><label>Vars</label><select><option>4</option><option>5</option></select><input type="text" value="m(1,3,4,5,9,10,11) d(6,8)"></div>'); w.appendChild(c); const o = el('<div></div>'); w.appendChild(o);
    const run = () => {
      const n = +$('select', c).value; const V = ['A', 'B', 'C', 'D', 'E'].slice(0, n);
      const { ones, dcs } = parseSpec($('input', c).value);
      const r = minimize(n, ones, dcs);
      const ds = t => range(n).map(i => { const b = n - 1 - i; return (t.d >> b) & 1 ? '-' : (t.v >> b) & 1; }).join('');
      let h = '<div class="grid3" style="align-items:start">';
      r.columns.forEach((col, k) => {
        const byG = {}; col.forEach(t => { const g = popc(t.v); (byG[g] = byG[g] || []).push(t); });
        h += `<div><b>Column ${k + 1}</b> ${k === 0 ? '(minterms)' : `(groups of ${1 << k})`}<table class="tt mono" style="font-size:13px"><tr><th>#1s</th><th>minterms</th><th>term</th><th>✓</th></tr>`;
        Object.keys(byG).sort((a, b) => a - b).forEach((g, gi) => byG[g].forEach((t, j) => {
          h += `<tr class="${j === 0 && gi ? 'sep' : ''}"><td>${j === 0 ? g : ''}</td><td>${t.ms.map(m => dcs.includes(m) ? `<span style="color:var(--sigx)">${m}</span>` : m).join(',')}</td><td>${ds(t)}</td><td>${t.used ? '✓' : `<b style="color:var(--exam)">PI</b>`}</td></tr>`;
        }));
        h += '</table></div>';
      });
      h += '</div>';
      const epiCols = new Set([...r.essentialFor.values()].flat());
      h += `<h4>Prime implicant chart</h4><div style="overflow:auto"><table class="tt"><tr><th>PI</th><th>literals</th>${ones.map(m => `<th style="${epiCols.has(m) ? 'color:var(--exam)' : ''}">${m}</th>`).join('')}</tr>`;
      r.pis.forEach(p => { const e = r.epis.includes(p); h += `<tr class="${e ? 'hl' : ''}"><td class="mono">${ds(p)}${e ? ' ★' : ''}</td><td><b>${termStr(p, V)}</b></td>${ones.map(m => `<td style="font-weight:700;${covers(p, m) && epiCols.has(m) && e ? 'color:var(--exam)' : ''}">${covers(p, m) ? 'X' : ''}</td>`).join('')}</tr>`; });
      h += '</table></div>';
      if (r.dcOnly && r.dcOnly.length) h += `<div class="mut" style="font-size:13px">Unticked terms covering only don't-cares (${r.dcOnly.map(ds).join(', ')}) are left out of the chart: they cover no required minterm.</div>`;
      h += `<div class="out">Red columns have a single X → the PI in that row is essential (★): <b>${r.epis.map(p => termStr(p, V)).join(', ') || 'none'}</b>.<br>Minimal SOP: <span class="eq">F = ${sopStr(r.solutions[0], V)}</span>${r.solutions.length > 1 ? `<br>Other equally minimal answers: ${r.solutions.slice(1).map(s => sopStr(s, V)).join(' ; ')}` : ''}</div>`;

});

CH.push({
  id: 'nandnor', part: 'Part 1 · Working in Binary', title: 'NAND-only and NOR-only circuits',
  lede: 'Real chips are cheapest to build from NAND and NOR gates. Every exam has at least one "realise using only 2-input NAND gates" part. The tool that makes this easy is bubble pushing.',
  builds: ['gates', 'kmap'], leads: ['latch', 'decoder'],
  html: `
<h3>1. Why NAND and NOR are "universal"</h3>
<p>If you can make NOT, AND and OR from one gate type, you can make anything. NAND can:</p>
<ul><li><b>NOT:</b> tie both NAND inputs together: (A·A)' = A'.</li><li><b>AND:</b> NAND followed by a NAND-inverter: ((AB)')' = AB.</li><li><b>OR:</b> invert both inputs first, then NAND: (A'B')' = A + B (De Morgan).</li></ul>
${W('w-univ', 'NOT, AND, OR built only from NAND gates (top) and only from NOR gates (bottom)', 'Each lamp should match the named function. Notice how many gates each needs: this is what "minimum number of NAND gates" questions count.')}
${box('key', 'Gate counts to remember', `<p>With NAND only: NOT = 1, AND = 2, OR = 3, NOR = 4, XOR = 4, XNOR = 5.</p><p>With NOR only: NOT = 1, OR = 2, AND = 3, NAND = 4, XNOR = 4, XOR = 5.</p><p>If <b>complemented inputs are available</b> (A' comes for free), OR from NAND needs only 1 gate: (A'·B')' = A + B.</p>`)}

<h3>2. Two-level SOP → NAND-NAND (bubble pushing)</h3>
<p>Any SOP (AND gates feeding an OR) converts directly to two levels of NAND gates. The trick is to add a pair of bubbles (two inversions cancel) on each wire between the levels:</p>
${W('w-bub', 'Bubble pushing, F = AB + CD', 'Step through. The lamp never changes behaviour, only the drawing does.')}
${box('trap', 'The single-literal trap', `<p>F = AB + C. In NAND-NAND form, the C term has no first-level gate. The second-level NAND must receive <b>C'</b> (the bubble on its input needs something to cancel). So either feed C' directly (if complemented inputs are available) or add a NAND-inverter. Forgetting this is the classic mistake.</p>`)}

<h3>3. Two-level POS → NOR-NOR</h3>
<p>Exactly the dual: POS is OR gates feeding an AND. Put double bubbles on the middle wires: the OR gates become NORs, and the AND with inverted inputs becomes a NOR. F = (A + B)(C + D) = NOR( NOR(A,B), NOR(C,D) ). A single-literal factor again needs to be complemented at the second level.</p>
${box('why', 'How to choose', `<p>Asked for NAND only → find the minimal <b>SOP</b> (group 1s). Asked for NOR only → find the minimal <b>POS</b> (group 0s). Doing it the other way round is possible but costs extra inverters.</p>`)}

<h3>4. When the gates have only 2 inputs (multi-level)</h3>
<p>Exams usually say "minimum number of <b>2-input</b> NAND gates". A 3-input AND is then two 2-input gates, and the clean two-level picture breaks. Method:</p>
<ol><li>Get the minimal SOP (or POS for NOR).</li><li><b>Factor</b> to reduce fan-in: AB + AC = A(B + C) (fewer gates).</li><li>Draw it with AND/OR gates of 2 inputs, alternating levels as much as possible.</li><li>Replace every AND by NAND and every OR by the bubbled-input form of NAND. Wherever a bubble is not cancelled by another bubble on the same wire, insert a NAND-inverter (or use the complemented input if available).</li><li>Count.</li></ol>
${W('w-xor', 'XOR from four 2-input NAND gates', 'This is the most famous multi-level NAND circuit. Gate 1 computes (AB)\'. Gates 2 and 3 compute A(AB)\' = AB\' and B(AB)\' = A\'B in inverted form. Gate 4 ORs them via De Morgan.')}
${box('exam', 'Exam lens: BCD prime detector with 2-input NANDs', `<p>Z = Q'R + QS (from the K-map chapter), with true and complement inputs available. NAND-NAND: N1 = (Q'R)', N2 = (QS)', Z = (N1·N2)' → <b>3 two-input NANDs</b>. This is also the equation of a 2:1 multiplexer with Q as the select line. Spotting that shape is often useful.</p>`)}
${box('exam', 'Exam lens: Lighthouse L with 2-input NOR gates (Midsem 2025 A4)', `<p>You get the minimal POS from the 0s, e.g. L = (W + Y')(W + X')(X' + Z)(Y' + Z)(W' + X + Y + Z'). With only 2-input NOR gates, <b>factor first</b>: (W + Y')(W + X') = W + X'Y' and (X' + Z)(Y' + Z) = Z + X'Y', so the two pairs become W + X'Y' and Z + X'Y', which share X'Y'. Every level of OR-then-AND maps to NOR-then-NOR. Sharing a factored subterm like X'Y' between two branches is how you get to the minimum count.</p>`)}
`,

function adderGates(c, i, y0, cinRef) { // gate-level full adder row i, returns {S, Co}
  const A = 'A' + i, B = 'B' + i;
  c.input(A, 50, y0, { val: 0 }); c.input(B, 50, y0 + 30, { val: 0 });
  c.gate('x1_' + i, 'XOR', 140, y0 + 15); c.gate('a1_' + i, 'AND', 140, y0 + 70);
  c.gate('x2_' + i, 'XOR', 270, y0 + 15); c.gate('a2_' + i, 'AND', 270, y0 + 60); c.gate('o_' + i, 'OR', 380, y0 + 75);
  c.wire(A, 'x1_' + i + '.0', { mx: 100 }); c.wire(B, 'x1_' + i + '.1', { mx: 110 });
  c.wire(A, 'a1_' + i + '.0', { pts: [[100, y0], [100, y0 + 61]] }); c.wire(B, 'a1_' + i + '.1', { pts: [[110, y0 + 30], [110, y0 + 79]] });
  c.dot(100, y0, A); c.dot(110, y0 + 30, B);
  c.wire('x1_' + i, 'x2_' + i + '.0', { mx: 225 }); c.wire('x1_' + i, 'a2_' + i + '.0', { mx: 225 }); c.dot(225, y0 + 15, 'x1_' + i);
  c.wire('a1_' + i, 'o_' + i + '.1', { pts: [[205, y0 + 70], [205, y0 + 100], [345, y0 + 100], [345, y0 + 84]] });
  c.wire('a2_' + i, 'o_' + i + '.0', { mx: 355 });
  c.wire(cinRef, 'x2_' + i + '.1', { pts: cinRef === 'C0' ? [[245, 16], [245, y0 + 24]] : [[450, y0 - 50], [450, y0 - 12], [245, y0 - 12], [245, y0 + 24]] });
  c.wire(cinRef, 'a2_' + i + '.1', { pts: cinRef === 'C0' ? [[245, 16], [245, y0 + 69]] : [[450, y0 - 50], [450, y0 - 12], [245, y0 - 12], [245, y0 + 69]] });
  c.dot(245, y0 + 24, cinRef);
  c.output('S' + i, 470, y0 + 15); c.wire('x2_' + i, 'S' + i);
  return 'o_' + i;
}

<h3>2. Full adder: adding three bits</h3>
<p>Every column except the first must add A<sub>i</sub>, B<sub>i</sub> <b>and</b> the carry-in C<sub>i</sub> from the column on its right. Three inputs, output from 0 to 3, so still two output bits (S, C<sub>out</sub>).</p>

CH.push({
  id: 'rca', part: 'Part 2 · Combinational Building Blocks', title: 'Ripple-carry adder, subtraction and overflow',
  lede: 'Chain full adders to add n-bit numbers. Add one XOR per bit and the same circuit subtracts. Then learn how long it takes, and how to tell when its answer is wrong.',
  builds: ['adders', 'signed'], leads: ['cla', 'bcd', 'mult', 'counters'],
  html: `
<h3>1. Chaining full adders</h3>
<p>To add two 4-bit numbers, use four full adders, one per column, and connect each carry-out to the next column's carry-in, exactly like carrying in column addition. This is a <b>ripple-carry adder</b>: the carry "ripples" from the LSB to the MSB. (A 4-bit adder as one truth table would need 2<sup>9</sup> = 512 rows. Reusing the full adder avoids that: lecture 6's "is there an easier way?")</p>

<h3>2. How long does an addition take? Watch the carry ripple</h3>
<p>Every gate takes a small time (its <b>propagation delay</b>, call it 1 unit) to respond. The sum of column 3 cannot be right until the carry from column 2 is right, which waits for column 1, and so on. Below, every gate has a delay of exactly 1 unit and you can watch the signals settle one gate at a time.</p>
${W('w-ripple', 'Gate-level 4-bit ripple-carry adder with real delays', 'Switches here do NOT update instantly. Set inputs, then press Propagate and watch time advance. Use "Worst case" to see the longest path.')}
${box('key', 'Lecture 7 result: 2n + 1 gate delays', `<p>Longest path: the first XOR (A⊕B, 1 delay, all columns in parallel), then for each of the n columns an AND and an OR (2 delays each) → carry-out at <b>2n + 1</b>. For n = 4 that is 9, which is what the timer shows in the worst case. For a 64-bit adder: 129 gate delays. At about 1 ns per gate, that is ~129 ns per addition, i.e. only about 7.7 million 64-bit additions per second.</p><p>Time grows <b>linearly</b> with n (O(n)). The fix is carry lookahead (next chapter).</p>`)}
${box('trap', 'Glitches while settling', `<p>During the animation, some sum bits flip to a wrong value and then back (for example S3 may show 1 before the carry arrives). The final answer is only valid after the worst-case delay. This is why sequential circuits later wait for a clock edge before reading results.</p>`)}

<h3>3. One circuit that adds and subtracts</h3>
<p>From the signed-numbers chapter: A − B = A + (2's complement of B) = A + B' + 1. So subtraction needs (1) every bit of B inverted and (2) an extra 1 added. Both come from a single control line M:</p>
<ul><li>Put an XOR on every B input: B<sub>i</sub> ⊕ M is B<sub>i</sub> when M = 0 and B<sub>i</sub>' when M = 1 (the XOR as a <b>programmable inverter</b>).</li><li>Connect M to the carry-in C<sub>0</sub>: it adds the "+1" exactly when subtracting.</li></ul>
${W('w-addsub', 'The 4-bit adder/subtractor (lecture 6, "S" or "M" line)', 'Set A, B and M. Readouts show the result as unsigned and as 2\'s complement, with the carry C4 and the overflow flag V = C3 ⊕ C4.')}
${box('trap', 'Reading the flags correctly (lecture 6 asked: "Is the subtraction result correct as is?")', `<p><b>Unsigned, M = 0:</b> C4 = 1 means the true sum did not fit (unsigned overflow).</p><p><b>Unsigned, M = 1 (A − B):</b> C4 = 1 means A ≥ B and the result is correct. C4 = 0 means A &lt; B: the true answer is negative, and the bits you got are the <b>2's complement of (B − A)</b>. Try A = 3, B = 5.</p><p><b>Signed (either M):</b> ignore C4. The result is wrong exactly when V = C3 ⊕ C4 = 1. The same V circuit works for subtraction with no change, because internally the circuit is always adding (Tutorial 3 Q2c).</p>`)}

<h3>4. Detective tool: find the adder's bit-width from its outputs</h3>
<p>Quiz 2 Q5 and Tutorial 3 Q2: some outputs of an adder of unknown width are wrong. Wrong outputs are not random: they are the true answer wrapped around the number wheel, i.e. reduced modulo 2<sup>n</sup> (and, for signed, re-read with the MSB as −2<sup>n−1</sup>). So test every n and keep the one that explains every row.</p>
${W('w-det', 'Bit-width detective', 'One row per line: "a + b = shown" or "a - b = shown". Choose unsigned or signed. Preset = your Quiz 2 (version A).')}
${box('why', 'Doing it by hand in the exam', `<p>Quiz 2: 50 + 14 displayed 0. True 64 → 64 mod 2<sup>n</sup> = 0, so 2<sup>n</sup> divides 64: n ≤ 6. 50 + 13 = 63 was shown correctly, so 63 fits: 2<sup>n</sup> > 63, n ≥ 6. Hence n = 6. Check the last one: 45 + 25 = 70 → 70 − 64 = 6 ✓. Always use a correct row to get a lower bound and a wrong row to pin the modulus.</p>`)}

CH.push({
  id: 'cla', part: 'Part 2 · Combinational Building Blocks', title: 'Carry lookahead: faster adders',
  lede: 'Instead of waiting for the carry to ripple, compute every carry directly from the inputs in two gate levels. The price is more gates.',
  builds: ['rca'], leads: ['sub'],
  html: `
<h3>1. Generate and propagate</h3>
<p>Look at one column i and ask: does this column produce a carry-out <i>by itself</i>, or does it just <i>pass along</i> a carry that comes in?</p>
<ul><li><b>Generate G<sub>i</sub> = A<sub>i</sub>B<sub>i</sub></b>: both bits are 1, so there is a carry-out no matter what comes in.</li>
<li><b>Propagate P<sub>i</sub> = A<sub>i</sub> ⊕ B<sub>i</sub></b>: exactly one bit is 1, so an incoming carry goes straight through (1 + 1 = 10) and no carry is made otherwise.</li></ul>
<p class="eqb">C<sub>i+1</sub> = G<sub>i</sub> + P<sub>i</sub>C<sub>i</sub> &nbsp;&nbsp;&nbsp;&nbsp; S<sub>i</sub> = P<sub>i</sub> ⊕ C<sub>i</sub></p>
<p>This is just the full-adder carry C<sub>out</sub> = AB + C<sub>in</sub>(A⊕B) with new names. The trick is to <b>substitute</b> each carry into the next so that no carry depends on another carry:</p>
<p class="eqb">C<sub>1</sub> = G<sub>0</sub> + P<sub>0</sub>C<sub>0</sub><br>C<sub>2</sub> = G<sub>1</sub> + P<sub>1</sub>G<sub>0</sub> + P<sub>1</sub>P<sub>0</sub>C<sub>0</sub><br>C<sub>3</sub> = G<sub>2</sub> + P<sub>2</sub>G<sub>1</sub> + P<sub>2</sub>P<sub>1</sub>G<sub>0</sub> + P<sub>2</sub>P<sub>1</sub>P<sub>0</sub>C<sub>0</sub><br>C<sub>4</sub> = G<sub>3</sub> + P<sub>3</sub>G<sub>2</sub> + P<sub>3</sub>P<sub>2</sub>G<sub>1</sub> + P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>G<sub>0</sub> + P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>P<sub>0</sub>C<sub>0</sub></p>
<p>Read each term as a sentence. The last term of C<sub>4</sub> says: "the input carry C<sub>0</sub> propagates through columns 0, 1, 2 and 3". The term P<sub>3</sub>P<sub>2</sub>G<sub>1</sub> says: "column 1 generated a carry and columns 2 and 3 passed it on".</p>
${W('w-cla', 'Which term makes each carry?', 'Set A, B and C0. Each carry equation lights up the product term(s) that are 1. A carry is 1 if any term in its row is lit.')}
${box('key', 'Why it is faster', `<p>Every C<sub>i</sub> is now a <b>sum of products</b> of G's, P's and C<sub>0</sub>: one AND level plus one OR level. Total delay: 1 (make all G, P) + 2 (AND-OR for carries) + 1 (final XOR for sums) = <b>4 gate levels, whatever n is</b>. Compare 2n + 1 = 9 for a 4-bit ripple adder and 129 for 64 bits.</p>`)}
${box('trap', 'The cost: gates and fan-in (Tutorial 3 Q4)', `<p>C<sub>i</sub> has i + 1 product terms, and the largest AND needs i + 1 inputs. Total gates grow like n²/2, i.e. <b>O(n²)</b>, and a 64-input AND gate is not physically practical. So real adders use <b>4-bit CLA blocks</b>.</p><p>Chaining 4-bit CLA blocks by their carries (ripple between blocks) still gives delay O(n), just with a 4× smaller slope. To really change the growth rate, apply the same G/P idea to the blocks: block-generate G* = G<sub>3</sub> + P<sub>3</sub>G<sub>2</sub> + P<sub>3</sub>P<sub>2</sub>G<sub>1</sub> + P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>G<sub>0</sub>, block-propagate P* = P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>P<sub>0</sub>, and a second-level lookahead unit. Recursively, delay becomes <b>O(log n)</b> with O(n) gates: for 64 bits, log<sub>4</sub>64 = 3 levels, roughly a dozen gate delays instead of 129.</p>`)}
${W('w-delay', 'Delay versus width', 'Gate delays for ripple carry (2n+1), 4-bit CLA blocks rippling (≈ 2 per block + overhead), and hierarchical lookahead (≈ 4 per level).')}
${box('why', 'Propagate can also be an OR', `<p>For the <b>carry</b> it does not matter whether P<sub>i</sub> = A<sub>i</sub>⊕B<sub>i</sub> or A<sub>i</sub>+B<sub>i</sub>: the only case where they differ is A<sub>i</sub>=B<sub>i</sub>=1, and then G<sub>i</sub> = 1 already makes the carry 1. But the <b>sum</b> S<sub>i</sub> = P<sub>i</sub>⊕C<sub>i</sub> needs the XOR version. For subtraction the borrow-propagate must be the OR-type one (next chapter).</p>`)}
`,
  init(root) {
    const w = mount(root, 'w-cla'); const ra = el('<div class="ctl"><b>A</b></div>'), rb = el('<div class="ctl"><b>B</b></div>'), rc = el('<div class="ctl"><label><input type="checkbox"> C0 = 1</label></div>'); w.append(ra, rb, rc); const o = el('<div></div>'); w.appendChild(o);

    const draw = () => {

      for (let i = 0; i < 4; i++) { G[i] = (A >> i) & (B >> i) & 1; P[i] = ((A >> i) ^ (B >> i)) & 1; }
      const lit = on => `style="display:inline-block;padding:1px 7px;margin:2px;border-radius:6px;border:1px solid ${on ? 'var(--sig1)' : 'var(--line)'};${on ? 'background:var(--sig1);color:#fff;font-weight:700' : 'opacity:.7'}"`;

      const C = [C0];
      for (let k = 1; k <= 4; k++) {
        const terms = [];
        for (let j = k - 1; j >= -1; j--) {
          const ps = []; for (let m = k - 1; m > j; m--) ps.push(m);

CH.push({
  id: 'sub', part: 'Part 2 · Combinational Building Blocks', title: 'Half and full subtractors (and a Verilog bug)',
  lede: 'Subtractors mirror adders, with one important difference: the borrow is NOT symmetric in its inputs. That asymmetry is behind a classic exam debugging question.',
  builds: ['adders', 'cla'], leads: ['verilog', 'bcd'],
  html: `
<h3>1. Half subtractor: X − Y</h3>
<div class="grid2"><div><table class="tt"><tr><th>X</th><th>Y</th><th>B (borrow)</th><th>D (difference)</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td class="one">1</td><td class="one">1</td></tr><tr><td>1</td><td>0</td><td>0</td><td class="one">1</td></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td></tr></table></div>
<div><p><b>D = X ⊕ Y</b> (same as the adder's sum).</p><p><b>B = X'Y</b>: you need to borrow only when you subtract 1 from 0. Row 0 − 1: borrow 1 from the next column, then 10 − 1 = 1, so D = 1, B = 1.</p><p>Unlike the carry AB, <b>X'Y ≠ Y'X</b>. Swapping the inputs changes the borrow.</p></div></div>
<h3>2. Full subtractor: X − Y − B<sub>in</sub></h3>
<p class="eqb">D = X ⊕ Y ⊕ B<sub>in</sub> &nbsp;&nbsp;&nbsp;&nbsp; B<sub>out</sub> = X'Y + X'B<sub>in</sub> + YB<sub>in</sub></p>
<p>B<sub>out</sub> is the majority function of (X', Y, B<sub>in</sub>): you must borrow when what you take away (Y + B<sub>in</sub>) is more than what you have (X). Built from two half subtractors: HS1 computes X − Y, HS2 computes (X − Y) − B<sub>in</sub>, and B<sub>out</sub> = B<sub>1</sub> + B<sub>2</sub>.</p>
${W('w-fs', 'Full subtractor from two half subtractors', 'Try all 8 inputs. Then press "Swap HS2 ports" to recreate the bug from Tutorial 3 Q3(b) and find the input where B_out goes wrong.')}
${box('exam', 'Exam lens: Tutorial 3 Q3(b)', `<p>The Verilog instantiated <code>half_subtractor HS2(.x(bin), .y(d1), ...)</code>. D is still right (XOR is symmetric), but HS2 now computes B<sub>in</sub>'·D<sub>1</sub> instead of D<sub>1</sub>'·B<sub>in</sub>. For (x,y,b<sub>in</sub>) = (0,0,1): 0 − 0 − 1 must borrow, but the wired circuit says B<sub>out</sub> = 0. The fix is <code>.x(d1), .y(bin)</code>. Lesson: for any non-symmetric block (subtractor, comparator, mux data/select), port order matters.</p>`)}
${box('link', 'Borrow lookahead (Tutorial 3 Q1c,d)', `<p>Write B<sub>out</sub> = X'Y + (X' + Y)B<sub>in</sub>. Matching B<sub>i+1</sub> = G<sub>i</sub> + P<sub>i</sub>B<sub>i</sub> gives borrow-generate <b>G<sub>i</sub> = X<sub>i</sub>'Y<sub>i</sub></b> and borrow-propagate <b>P<sub>i</sub> = X<sub>i</sub>' + Y<sub>i</sub></b>. Here P must be the OR form: with XOR, the case X=0,Y=1 would wrongly not propagate. Then B<sub>4</sub> = G<sub>3</sub> + P<sub>3</sub>G<sub>2</sub> + P<sub>3</sub>P<sub>2</sub>G<sub>1</sub> + P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>G<sub>0</sub> + P<sub>3</sub>P<sub>2</sub>P<sub>1</sub>P<sub>0</sub>B<sub>in</sub>, same shape as C<sub>4</sub>.</p>`)}
${box('why', 'In practice you rarely build a separate subtractor', `<p>The adder/subtractor (A + B' + 1) does subtraction with an adder. The dedicated subtractor matters in exam questions that hand you one as a component, and for understanding borrows.</p>`)}
`,
  init(root) {
    const w = mount(root, 'w-fs'); const ctl = el('<div class="ctl"></div>'); w.appendChild(ctl); const host = el('<div></div>'); w.appendChild(host); const o = el('<div class="out"></div>'); w.appendChild(o);
    let swapped = false; const st = { X: 0, Y: 0, Bin: 1 };

  html: `
<h3>1. BCD → Excess-3 code converter</h3>
<p>Input: a BCD digit ABCD (4 bits). Output: its Excess-3 code wxyz = the binary of (digit + 3). There are 4 outputs, so you need 4 K-maps. Inputs 10 to 15 never happen → don't-cares in every map. This is the standard design procedure for any multi-output combinational circuit:</p>
<ol><li>Count inputs and outputs, name them.</li><li>Truth table (with X for impossible inputs).</li><li>One K-map per output.</li><li>Draw, sharing gates between outputs if possible.</li></ol>
${W('w-x3tt', 'Truth table')}
<div class="grid2"><div>${W('w-x3w', 'w')}</div><div>${W('w-x3x', 'x')}</div><div>${W('w-x3y', 'y')}</div><div>${W('w-x3z', 'z')}</div></div>
${box('why', 'Reading the answers', `<p>z = D' (adding 3 = 11 flips the LSB). y = CD + C'D' = (C ⊕ D)'. Mano then shares the term (C + D) between x and w in a multi-level circuit. The don't-cares are what make these expressions this short: try redoing w without them.</p>`)}

<h3>2. The BCD (decimal) adder</h3>
<p>Add two BCD digits (0 to 9) plus a carry-in. The true sum is 0 to 19 and must come out as a BCD digit plus a decimal carry. Idea (lecture 11): add them with an ordinary 4-bit binary adder; the binary sum K Z<sub>8</sub>Z<sub>4</sub>Z<sub>2</sub>Z<sub>1</sub> is right whenever it is ≤ 9. If it is 10 or more, add <b>6 (0110)</b> and set the decimal carry.</p>
${box('key', 'Why exactly 6, and when', `<p>4 bits count to 16 but a decimal digit wraps at 10. The 6 codes 1010 to 1111 are skipped in BCD, so a sum past 9 has to jump over them: adding 6 does exactly that (e.g. 7 + 5 = 12 = 1100 → +0110 = 1 0010 = "1" and "2").</p><p>Correction needed when the sum is 10 to 19: either the binary adder produced a carry K (sum 16 to 19), or the 4-bit result is 1010 to 1111. From a K-map of those six codes: <b>C = K + Z<sub>8</sub>Z<sub>4</sub> + Z<sub>8</sub>Z<sub>2</sub></b>. This C is the decimal carry-out and also feeds 0CC0 (= 6 or 0) into the second adder.</p>`)}
${W('w-bcdadd', 'BCD adder (live block diagram)', 'Pick two digits and C_in. Follow the binary sum, the correction detector, and the second adder.')}
${box('trap', 'Edge cases', `<p>The second adder's own carry-out is ignored (it would only duplicate C).</p><p>9 + 9 + 1 = 19: first adder gives 1 0011 (K = 1), correction adds 6 → 1001 with decimal carry 1: "19" ✓. This is why K must be part of C: 1 0011 has Z<sub>8</sub> = 0, so the Z terms alone miss it.</p><p>If an input digit is not valid BCD (e.g. 1100), the circuit's output is meaningless: those cases were don't-cares.</p><p>An n-digit decimal adder is n of these in a chain, carry to carry, exactly like the ripple-carry adder.</p>`)}
${box('exam', 'Exam lens', `<p>The parking-lot question (comprehensive 2025) built a BCD up/down counter: the same "detect 9 / detect 0 and wrap" logic, now with flip-flops. And prime-number and Excess-3 style questions come straight from the BCD don't-cares.</p>`)}

CH.push({
  id: 'decoder', part: 'Part 2 · Combinational Building Blocks', title: 'Decoders: minterm generators',
  lede: 'A decoder turns an n-bit code into 2^n separate lines, exactly one of them active. Because each output line IS a minterm, a decoder plus an OR gate can build any function.',
  builds: ['canon', 'gates', 'nandnor'], leads: ['encoder', 'mux', 'pld', 'counters', 'systems'],
  html: `
<h3>1. What a decoder does</h3>
<p>Lecture 12's question: turn on exactly one of 8 LEDs, depending on a stored 3-bit value. The 3 wires carry a compact code; the decoder <b>expands</b> it into 8 wires, one per possible value.</p>
${W('w-led', '3-to-8 decoder driving 8 LEDs', 'Set the 3-bit value. Exactly one LED lights: the one whose number equals the binary input.')}
<h3>2. Inside a decoder: one AND gate per output</h3>
<p>Output D<sub>k</sub> must be 1 only for input k. That is exactly the definition of minterm m<sub>k</sub>. So a 2-to-4 decoder is four AND gates fed by the inputs and their complements: D<sub>0</sub> = A'B', D<sub>1</sub> = A'B, D<sub>2</sub> = AB', D<sub>3</sub> = AB. An <b>enable</b> input EN goes into every AND gate: EN = 0 forces all outputs to 0.</p>
${W('w-2to4', '2-to-4 decoder at gate level', 'Toggle A, B, EN. Switch between the active-high version (AND gates) and the active-low version (NAND gates, active-low enable), which is how most real decoder chips (e.g. 74x138) are built.')}
${box('key', 'Decoder facts (Lecture 12/13 review questions)', `<p>n inputs → 2<sup>n</sup> outputs, 2<sup>n</sup> AND gates of n inputs each (n+1 with an enable), plus n inverters.</p><p><b>Active-high</b> outputs: the selected output is 1, others 0 → each output is a minterm m<sub>k</sub>.</p><p><b>Active-low</b> outputs (bubbles on the outputs): the selected output is 0, others 1 → each output is m<sub>k</sub>' = <b>M<sub>k</sub>, a maxterm</b>. That is why lecture 12 calls active-low decoders "maxterm generators".</p><p>A decoder with an enable is also a <b>demultiplexer</b>: put the data on EN and the address on the inputs; the data appears on the one selected output.</p>`)}

<h3>3. Building big decoders from small ones (hierarchical design)</h3>
<p>A 3-to-8 decoder from two 2-to-4 decoders: B and C go to both; A decides which of the two is enabled (A' enables the upper one, which produces D<sub>0</sub>–D<sub>3</sub>; A enables the lower one, D<sub>4</sub>–D<sub>7</sub>). Lecture 12 asked you to verify this: D<sub>5</sub> = A · (B'C) = AB'C = m<sub>5</sub> ✓.</p>
${W('w-hier', 'Two 2-to-4 decoders = one 3-to-8 decoder', 'The MSB drives the enables. This is the same "use the top bits to choose a block" idea as memory chips.')}
${box('why', 'Generalising', `<p>A 4-to-16 decoder: two 3-to-8 decoders with the MSB on the enables, or five 2-to-4 decoders in a tree (one decodes the top two bits and its four outputs enable four others). Tutorial 5 Q1(c) asked for F = Σm(1,4,7,9,10) with only 2-to-4 decoders and one OR gate: use the tree and OR the five needed outputs.</p>`)}

<h3>4. Implementing any function with a decoder</h3>
<p>Every output of an active-high decoder is a minterm, so <b>F = Σm(list) = OR of those decoder outputs</b>. One decoder can serve several functions of the same inputs: each gets its own OR gate. Lecture 12's full adder: S = Σm(1,2,4,7), C = Σm(3,5,6,7) from a single 3-to-8 decoder and two OR gates.</p>
${W('w-impl', 'Decoder function builder', 'Type the minterms of F1 and F2 (inputs A, B, C). Pick how the decoder is used. The wiring is redrawn and stays live.')}
${box('key', 'The four ways to use a decoder (pick the cheapest)', `<p><b>Active-high + OR</b>: connect the minterms of F (the 1-rows).</p><p><b>Active-high + NOR</b>: connect the minterms of F' (the 0-rows) and invert: cheaper when F has more 1s than 0s.</p><p><b>Active-low + NAND</b>: connect the 1-rows. NAND of (m<sub>k</sub>') = OR of m<sub>k</sub> by De Morgan.</p><p><b>Active-low + AND</b>: connect the 0-rows. Each active-low output is a maxterm, and F = ΠM(0-rows).</p><p>Rule of thumb: choose the gate whose input count is min(#1-rows, #0-rows).</p>`)}
${box('trap', 'Traps', `<p><b>Enable polarity</b>: the comprehensive exam used "active-low output and active-low enable". If the enable pin has a bubble, you must tie it to 0 to make the decoder work.</p><p><b>Which input is the MSB</b>: decoder input labels (A2 A1 A0 or S2 S1 S0) decide output numbering. Connect your function's first variable to the MSB pin.</p><p><b>Waste</b>: a 3-to-8 decoder always builds all 8 AND gates even if you use three of them (Tutorial 5 Q2). This waste is exactly what a PLA removes.</p>`)}
${box('exam', 'Exam lens', `<p>Tutorial 5 Q1(a): a 1-bit comparator with one 2-to-4 decoder and one OR gate. Inputs X, Y. "X > Y" is only row XY = 10 → it is simply output D<sub>2</sub>, no gate needed. "X = Y" is rows 00 and 11 → D<sub>0</sub> + D<sub>3</sub>, the single OR gate. "Minimal components" questions reward noticing that some outputs need no gate at all.</p><p>Midsem 2025 Task B1 used a 3-to-8 decoder on the XOR of the new and old Gray codes to flag "more than one bit changed" (outputs 3, 5, 6, 7 into a 4-input OR). See <span class="chip" data-go="systems">System design</span>.</p>`)}

CH.push({
  id: 'mux', part: 'Part 2 · Combinational Building Blocks', title: 'Multiplexers and demultiplexers',
  lede: 'A multiplexer is a digitally controlled switch: the select lines choose which data input reaches the output. Because it can pick one row of a truth table at a time, it can implement any function, and it is the most-examined block in this course.',
  builds: ['decoder', 'canon', 'kmap'], leads: ['pld', 'registers', 'counters', 'verilog'],
  html: `
<h3>1. The 2-to-1 multiplexer</h3>
<p>Lecture 13 starts with traffic lights: one signal is sent to the output, chosen by a control input. With one select line S: Y = I<sub>0</sub> when S = 0, Y = I<sub>1</sub> when S = 1.</p>
<p class="eqb">Y = S'I<sub>0</sub> + SI<sub>1</sub></p>
<p>Read it as two AND gates acting as gates in a fence: S' opens the I<sub>0</sub> gate, S opens the I<sub>1</sub> gate. Only one is open at a time, and the OR collects whichever got through.</p>
${W('w-m2', '2-to-1 mux at gate level')}
<h3>2. The 4-to-1 multiplexer</h3>
<p>Two select lines S<sub>1</sub>S<sub>0</sub> choose one of four inputs. Inside it is a 2-to-4 decoder (the AND gates with S<sub>1</sub>, S<sub>0</sub> combinations) whose outputs each open one data input:</p>
<p class="eqb">Y = S<sub>1</sub>'S<sub>0</sub>'I<sub>0</sub> + S<sub>1</sub>'S<sub>0</sub>I<sub>1</sub> + S<sub>1</sub>S<sub>0</sub>'I<sub>2</sub> + S<sub>1</sub>S<sub>0</sub>I<sub>3</sub></p>
${W('w-m4', '4-to-1 mux at gate level', 'Set the data bits I0..I3 to any pattern, then change S1 S0: the output copies the selected input.')}
${box('key', 'Mux facts', `<p>2<sup>n</sup> data inputs need n select lines. Each data input is ANDed with the minterm of the select lines that picks it: Y = Σ m<sub>k</sub>(S)·I<sub>k</sub>.</p><p>An <b>enable</b> (strobe) input: when disabled the output is forced to 0 (or 1 for some parts). Lecture 13's 4:1 mux has an <b>active-low</b> enable (bubble): EN = 0 means "working". Always check the bubble.</p><p>"Truth table abbreviations": in a mux table you write the output as a variable (Y = I<sub>2</sub>) instead of listing every data combination.</p>`)}
<h3>3. Bigger multiplexers from smaller ones</h3>
<p>An 8:1 mux from two 4:1 muxes and a 2:1 mux: the low select bits S<sub>1</sub>S<sub>0</sub> go to both 4:1s (each picks a candidate), and the MSB S<sub>2</sub> picks between the two candidates. (Alternatively use the enables of the two 4:1s with S<sub>2</sub> and S<sub>2</sub>' and OR their outputs.)</p>

<h3>4. Implementing Boolean functions with a MUX (the big exam topic)</h3>
<h4>Method 1: n variables on n select lines</h4>
<p>Connect all variables to the select lines. Each data input corresponds to one row of the truth table, so tie it to that row's output: 1 or 0. The mux literally <b>looks up</b> the truth table.</p>
<h4>Method 2: n − 1 variables on the select lines (one variable goes to the data inputs)</h4>
<p>Each select combination now covers <b>two</b> rows, which differ only in the leftover variable, say D. For each pair, the output as a function of D is one of four things: <b>0</b> (both rows 0), <b>1</b> (both rows 1), <b>D</b> (0 then 1), or <b>D'</b> (1 then 0). That is Mano's implementation table: list the minterms in two rows (D' row and D row), circle the 1s, and read each column.</p>
<h4>Method 3: n − 2 variables on the selects</h4>

    const dcs = all.filter(m => !ones.includes(m) && sub.every(j => fs[j].ones.includes(m) || fs[j].dcs.includes(m)));

    let need = null;
    for (let j = 0; j < fs.length && !need; j++) for (const m of fs[j].ones) { if (!set.some(ci => imp[ci][j] && covers(C[ci], m))) { need = [j, m]; break; } }

    if (best && set.length + 1 > best.length) return;
