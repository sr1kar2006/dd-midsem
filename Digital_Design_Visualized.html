CH.push({
  id: 'pld', part: 'Part 2 · Combinational Building Blocks', title: 'Programmable logic: ROM, PLA, PAL',
  lede: 'A decoder builds every minterm whether you need it or not. Programmable logic devices keep the AND-OR structure but let you choose which connections exist.',
  builds: ['decoder', 'kmap', 'canon'], leads: ['systems'],
  html: `
<h3>1. The common picture: an AND array feeding an OR array</h3>
<p>Every SOP circuit is a set of AND gates (products) feeding OR gates (sums). A PLD is that structure pre-built on a chip, with fuses (or switches) at the crossings. In diagrams, one horizontal line represents a multi-input AND gate, and an ✕ on a crossing means "this input is connected".</p>
<table class="tt"><tr><th>Device</th><th>AND array</th><th>OR array</th><th>Think of it as</th></tr>
<tr><td><b>ROM</b></td><td>fixed: all 2<sup>n</sup> minterms (a decoder)</td><td>programmable</td><td>a stored truth table</td></tr>
<tr><td><b>PLA</b></td><td>programmable</td><td>programmable</td><td>shared minimal SOP</td></tr>
<tr><td><b>PAL</b></td><td>programmable</td><td>fixed (each OR has its own ANDs)</td><td>separate minimal SOPs</td></tr></table>
<h3>2. ROM: a truth table in hardware</h3>
<p>A 2<sup>n</sup> × m ROM has n address inputs, a decoder producing all 2<sup>n</sup> minterm lines ("words"), and m outputs. Programming = choosing, for each word, which outputs get a 1. That is exactly writing the output columns of a truth table. Size is stated as 2<sup>n</sup> × m bits.</p>
${W('w-rom', '8 × 2 ROM (click OR-array crossings to program it)', 'Pre-programmed as a full adder: F1 = S = Σm(1,2,4,7), F2 = C = Σm(3,5,6,7). Change the inputs: exactly one word line is active and the outputs read that row.')}
<h3>3. PLA: only the products you need, shared between outputs</h3>
<p>Tutorial 5 Q2 motivated this: F1 = Σm(1,3,5), F2 = Σm(3,5,6), F3 = Σm(1,6) use only 4 of the 8 decoder AND gates. A PLA builds only the needed product terms, and a term needed by two outputs is built once and connected to both OR gates.</p>
${box('key', 'PLA size and the programming table', `<p><b>Size = inputs × product terms × outputs</b>, e.g. 3 × 4 × 2. Inputs and outputs are fixed by the problem, so <b>"minimum size PLA" means the minimum number of distinct product terms</b> across all outputs.</p><p><b>Programming table</b> (Mano's format): one row per product term. Input columns: 1 = true literal used, 0 = complemented literal used, − = variable not used. Output columns: 1 = this term is connected to that output's OR gate, − (or blank) = not connected.</p>`)}
${W('w-pla', 'PLA builder: minimum number of shared product terms', 'Enter up to 3 functions of the same variables. The builder searches for the smallest set of product terms that covers every output, allowing sharing. The array and the programming table are live.')}
${box('trap', 'Why "minimise each function separately" can be wrong for a PLA', `<p>Load the full-subtractor preset (Midsem 2025 Q2: B = borrow, D = difference). Separately, D = P'Q'R + P'QR' + PQ'R' + PQR (4 terms, cannot be reduced) and B = P'Q + P'R + QR (3 terms): 7 terms. But B can reuse two of D's minterm terms, P'QR' (covers m2) and PQR (covers m7), and then needs only P'R to cover m1 and m3: B = P'R + P'QR' + PQR. Total <b>5</b> distinct terms instead of 7. The builder finds the true minimum. Sharing sometimes means using terms that are <b>not prime</b> for one function. Always check whether the other function's terms can be reused.</p>`)}
<h3>4. PAL</h3>
<p>A PAL has a programmable AND array but each OR gate has its own fixed group of AND gates (say 3 or 4). No sharing between outputs, but cheaper and faster. You minimise each function separately and check it fits the number of product terms per output; if not, you feed one output back as an input to another.</p>
${box('exam', 'Exam lens', `<p>Midsem 2025 Q2: full subtractor with minimum PLA, give the truth table, K-maps, programming table and the implementation. Comprehensive 2024 Q6: two 4-variable functions, minimum size PLA, "only true outputs" (no output inverters, so you cannot implement F' and invert). Know the table format and state the size as n × k × m.</p>`)}
`,
  init(root) {
    const romConn = range(8).map(k => [[1, 2, 4, 7].includes(k), [3, 5, 6, 7].includes(k)]);
    arrayViz(mount(root, 'w-rom'), { vars: ['A', 'B', 'C'], terms: range(8).map(k => ({ imp: { v: k, d: 0 }, name: 'm' + k + ' ' + bstr(k, 3) })), outs: ['F1', 'F2'], conn: romConn, fixedAnd: true, state: { A: 1, B: 0, C: 1 } });
    const pw = mount(root, 'w-pla');
    const pc = el(`<div class="ctl"><label>vars</label><select id="pn"><option>3</option><option selected>4</option></select><label>F1</label><input type="text" id="p1" value="m(1,3,5,7,8,10,11)" style="min-width:150px"><label>F2</label><input type="text" id="p2" value="m(6,7,8,10,11,14,15)" style="min-width:150px"><label>F3</label><input type="text" id="p3" value="" style="min-width:110px"></div>`);
    pw.appendChild(pc); const pp = el('<div class="ctl"><label>Presets:</label></div>'); pw.appendChild(pp);
    const ph = el('<div></div>'); pw.appendChild(ph);
    const presets = [['Comprehensive 2024 Q6', 4, 'm(1,3,5,7,8,10,11)', 'm(6,7,8,10,11,14,15)', ''], ['Full subtractor P−Q−R (Midsem 2025)', 3, 'm(1,2,3,7)', 'm(1,2,4,7)', ''], ['Tutorial 5 Q2', 3, 'm(1,3,5)', 'm(3,5,6)', 'm(1,6)'], ['Full adder', 3, 'm(1,2,4,7)', 'm(3,5,6,7)', '']];
    presets.forEach(([nm, n, a, b, cc]) => pp.appendChild(btn(nm, () => { $('#pn', pc).value = n; $('#p1', pc).value = a; $('#p2', pc).value = b; $('#p3', pc).value = cc; run(); })));
    const run = () => {

      const fsRaw = ['p1', 'p2', 'p3'].map(id => $('#' + id, pc).value.trim()).filter(Boolean);
      const fs = fsRaw.map(s => { const r = parseSpec(s); return { ones: r.ones.filter(x => x < (1 << n)), dcs: r.dcs.filter(x => x < (1 << n)) }; });

      ph.innerHTML = '';

      ph.innerHTML = h;

    };
    $$('input,select', pc).forEach(e => e.onchange = run); run();
  }

function codeBlock(src) { return `<pre class="code">${hlCode(src)}</pre>`; }
function bnbStepper(host) {
  const ex = {
    swapB: { code: 'always @(posedge clk) begin\n  a = b;   // blocking\n  b = a;\nend', init: { a: 1, b: 0 }, steps: [[1, 'Clock edge. The block starts running, one statement at a time.', {}, {}], [2, '<b>a = b</b> executes <i>and updates a immediately</i>: a becomes 0.', { a: 0 }, {}], [3, '<b>b = a</b> reads the <i>new</i> a (0). b becomes 0. The old value of a is lost.', { b: 0 }, {}], [4, 'Result: a = 0, b = 0. No swap! Blocking statements behave like software: each line sees the previous line\'s result.', {}, {}]] },
    swapN: { code: 'always @(posedge clk) begin\n  a <= b;  // non-blocking\n  b <= a;\nend', init: { a: 1, b: 0 }, steps: [[1, 'Clock edge. Phase 1: every right-hand side is <b>evaluated</b> using the values from before the edge. Nothing is written yet.', {}, {}], [2, '<b>a <= b</b>: evaluate b = 0, schedule "a gets 0". a is still 1.', {}, { a: 0 }], [3, '<b>b <= a</b>: evaluate a = 1 (the OLD a), schedule "b gets 1".', {}, { a: 0, b: 1 }], [4, 'Phase 2: all scheduled updates happen together at the end of the time step. a = 0, b = 1: <b>swapped</b>. This is how real flip-flops behave: they all sample at the same edge.', { a: 0, b: 1 }, {}]] },
    shB: { code: 'always @(posedge clk) begin\n  q1 = d;\n  q2 = q1;\n  q3 = q2;\nend', init: { d: 1, q1: 0, q2: 0, q3: 0 }, steps: [[1, 'Clock edge, d = 1.', {}, {}], [2, 'q1 = d → q1 = 1 now.', { q1: 1 }, {}], [3, 'q2 = q1 → reads the new q1 → 1.', { q2: 1 }, {}], [4, 'q3 = q2 → 1. After ONE edge all three are 1: the "shift register" collapsed into copies of d. Synthesis builds 3 flip-flops all fed by d (or merges them).', { q3: 1 }, {}]] },
    shN: { code: 'always @(posedge clk) begin\n  q1 <= d;\n  q2 <= q1;\n  q3 <= q2;\nend', init: { d: 1, q1: 0, q2: 0, q3: 0 }, steps: [[1, 'Clock edge, d = 1. Evaluate all right-hand sides with the old values.', {}, {}], [2, 'q1 <= d: schedule q1 = 1.', {}, { q1: 1 }], [3, 'q2 <= q1: old q1 = 0, schedule q2 = 0.', {}, { q1: 1, q2: 0 }], [4, 'q3 <= q2: old q2 = 0, schedule q3 = 0. Then all update: q1 = 1, q2 = 0, q3 = 0. The 1 moved <b>one stage</b> per clock: a real 3-stage shift register.', { q1: 1, q2: 0, q3: 0 }, {}]] }
  };
  const ctl = el('<div class="ctl"></div>'); host.appendChild(ctl);
  const g = el('<div class="grid2"></div>'); host.appendChild(g); const cd = el('<div></div>'), vt = el('<div></div>'); g.append(cd, vt);
  const nar = el('<div class="narr"></div>'); host.appendChild(nar);
  let cur = 'swapB', k = 0, vals = {}, sched = {};
  const show = () => {
    const e = ex[cur]; cd.innerHTML = codeBlock(e.code);
    if (k > 0) { const [ln] = e.steps[k - 1]; const l = cd.querySelector(`[data-l="${ln + 0}"]`); if (l && ln <= e.code.split('\n').length) l.classList.add('hl'); }
    vt.innerHTML = `<table class="tt"><tr><th>variable</th><th>current value</th><th>scheduled (pending) update</th></tr>${Object.keys(e.init).map(v => `<tr><td class="mono">${v}</td><td class="mono"><b>${vals[v]}</b></td><td class="mono" style="color:var(--sigx)">${sched[v] !== undefined ? '← ' + sched[v] : ''}</td></tr>`).join('')}</table>`;
    nar.innerHTML = k === 0 ? 'Press Step to fire one clock edge.' : e.steps[k - 1][1];
  };
  const reset = () => { k = 0; vals = { ...ex[cur].init }; sched = {}; show(); };
  const step = () => { const e = ex[cur]; if (k >= e.steps.length) return; const [, , nv, ns] = e.steps[k]; Object.assign(vals, nv); sched = { ...ns }; if (Object.keys(nv).length && !Object.keys(ns).length && cur.endsWith('N')) sched = {}; k++; show(); };
  [['swapB', 'Swap, blocking ='], ['swapN', 'Swap, non-blocking <='], ['shB', 'Shift, blocking ='], ['shN', 'Shift, non-blocking <=']].forEach(([id, nm]) => ctl.appendChild(btn(nm, e => { cur = id; $$('button', ctl).forEach(b => b.classList.remove('on')); e.target.classList.add('on'); reset(); })));
  ctl.append(el('<span style="width:10px"></span>'), btn('Step ▶', step, 'pri'), btn('Reset', reset));
  $('button', ctl).classList.add('on'); reset();
}
CH.push({
  id: 'verilog', part: 'Part 3 · Verilog HDL', title: 'Verilog: describing hardware in code',
  lede: 'Verilog is not a programming language that runs line by line. It is a way of describing wires and gates (and flip-flops) that all work at the same time. Read every line as "this piece of hardware exists".',
  builds: ['adders', 'sub', 'mux'], leads: ['ff', 'registers', 'counters'],
  html: `
<h3>1. Modules and ports</h3>
<p>A <b>module</b> is a box with ports, exactly like the blocks you have drawn. Inside you describe what the box contains. Three styles, from low to high abstraction: <b>structural / gate level</b> (list the gates), <b>dataflow</b> (<code>assign</code> equations), <b>behavioural</b> (<code>always</code> blocks describing what happens).</p>
${codeBlock('module half_adder(input a, b, output s, c);\n  xor (s, a, b);   // gate primitive: OUTPUT FIRST, then inputs\n  and (c, a, b);\nendmodule')}
${box('key', 'Gate primitives', `<p><code>and, or, not, nand, nor, xor, xnor, buf</code>. The first port is always the <b>output</b>. <code>and (w3, w1, r)</code> means w3 = w1 AND r. Any number of inputs is allowed.</p>`)}
<h3>2. Reading structural code = drawing the circuit</h3>
<p>Tutorial 3 Q3(a). Hover over a code line to see which gate it creates. Notice the order of the lines does <b>not</b> matter: <code>and (w3, w1, r)</code> uses w1 before the line that makes w1. All gates exist and work simultaneously.</p>
${W('w-myst', 'Code ↔ circuit', 'Hover the lines. Then play with p and r: they never change f, because f = pqr + q + s = q + s (absorption).')}
<h3>3. Instantiating modules (hierarchy)</h3>
${codeBlock('module full_adder(input x, y, cin, output s, cout);\n  wire s1, c1, c2;\n  half_adder HA1 (.a(x),  .b(y),   .s(s1), .c(c1));  // named ports\n  half_adder HA2 (.a(s1), .b(cin), .s(s),  .c(c2));\n  or (cout, c1, c2);\nendmodule')}
<p><b>Named</b> connection <code>.port(signal)</code> is safe against order mistakes. <b>Positional</b> connection <code>half_adder HA1 (s1, c1, x, y)</code> must follow the declared port order exactly. For symmetric blocks swapping inputs is harmless; for non-symmetric blocks (subtractor, mux) it is a bug: see <span class="chip" data-go="sub">the subtractor chapter</span>.</p>

<h3>4. wire vs reg: what they physically mean</h3>
<ul><li><b>wire</b> (a net) is a physical connection. It has no memory; it always shows whatever is driving it: a gate output, an <code>assign</code>, or a module output port. You can <b>never</b> assign a wire inside <code>initial</code> or <code>always</code>.</li>
<li><b>reg</b> is a variable that <b>holds</b> the last value assigned to it until assigned again. Anything assigned inside <code>initial</code> or <code>always</code> must be a reg (or integer etc.). "reg" does <b>not</b> automatically mean a hardware register: a reg in a combinational <code>always @(*)</code> becomes plain gates.</li></ul>
${W('w-tb', 'Fix the testbench (Tutorial 3 Q3c)', 'Click each declaration keyword to flip it between wire and reg, then press Check.')}
${box('why', 'The rule from first principles', `<p>In a testbench, <b>you</b> drive the DUT's inputs from an <code>initial</code> block, step by step. Something you set procedurally and that must keep its value between steps is a <b>reg</b>. The DUT's outputs are driven continuously by the DUT's own gates, so on the testbench side they are just <b>wires</b> connected to those gates. Every one of the five declarations in the tutorial had the wrong type.</p>`)}
<h3>5. Numbers, vectors and operators</h3>
<p>Vectors: <code>wire [3:0] A;</code> is a 4-bit bus, A[3] is the MSB. Part select <code>A[2:1]</code>. Literals: <code>4'b1010</code> (4-bit binary), <code>8'hFF</code>, <code>3'd5</code>. Unsized numbers like <code>5</code> are 32 bits. Two extra logic values: <b>x</b> (unknown) and <b>z</b> (high impedance, undriven). Other types: <code>integer</code> (signed 32-bit, used in testbenches), <code>parameter WIDTH = 8</code> (a constant you can override), <code>localparam</code> (cannot be overridden), memories <code>reg [7:0] mem [0:15];</code> (16 words of 8 bits).</p>
${W('w-ops', 'Operator playground (4-bit a and b)', 'Change a and b. Compare bitwise ~ & | with logical ! && ||, and see what the reduction operators do.')}
${box('trap', 'Operator traps', `<p><code>~a</code> flips every bit; <code>!a</code> is 1 only if a is all zeros (a single bit). <code>a & b</code> is bit-by-bit; <code>a && b</code> is "both non-zero" (1 bit).</p><p>Reduction: <code>&a</code> = AND of all bits of a, <code>^a</code> = XOR of all bits = <b>parity</b>.</p><p><code>==</code> gives x if either side has x/z; <code>===</code> compares x and z literally (simulation only).</p><p>Arithmetic wraps to the width of the destination: a 4-bit result of 9 + 9 is 2.</p><p>Precedence (lecture 15): unary, * / %, + −, shifts, relational, equality, reduction/bitwise, logical, ?: last. When in doubt, use parentheses.</p>`)}
<h3>6. Dataflow modelling: continuous assignment</h3>
${codeBlock("module mux2 (input i0, i1, s, output y);\n  assign y = s ? i1 : i0;          // conditional operator = a 2:1 mux\nendmodule\n\nmodule add4 (input [3:0] a, b, input cin, output [3:0] sum, output cout);\n  assign {cout, sum} = a + b + cin; // concatenation catches the carry\nendmodule")}
<p><code>assign</code> drives a <b>wire</b> continuously: whenever anything on the right changes, the left updates (optionally after a delay: <code>assign #10 out = in1 & in2;</code>). RTL code says <i>what</i> to compute; the synthesis tool decides <i>how</i> (ripple, CLA, ...).</p>
<h3>7. Behavioural modelling: initial and always</h3>
<ul><li><code>initial</code> runs once, starting at time 0 (testbenches, initialisation). Several initial blocks run in parallel.</li><li><code>always @(sensitivity list)</code> waits for an event, runs, and waits again. <code>always @(*)</code> = combinational logic (sensitive to everything read). <code>always @(posedge clk)</code> = edge-triggered flip-flops.</li><li>Blocks cannot be nested. Inside them: <code>if/else</code>, <code>case</code>, <code>for</code>, <code>while</code>, <code>begin ... end</code>.</li></ul>
${codeBlock("always @(*) begin               // combinational 4:1 mux\n  case (sel)\n    2'b00: y = i0;\n    2'b01: y = i1;\n    2'b10: y = i2;\n    default: y = i3;\n  endcase\nend\n\nalways @(posedge clk or negedge rst_n)   // D flip-flop, async active-low reset\n  if (!rst_n) q <= 1'b0;\n  else        q <= d;")}

<h3>8. Blocking (=) vs non-blocking (<=): the most important Verilog idea</h3>
${W('w-bnb', 'Step through what the simulator does at a clock edge')}
${box('key', 'Rules of thumb', `<p><b>Sequential logic (<code>always @(posedge clk)</code>): use <code><=</code>.</b> All flip-flops sample their inputs at the same instant, and <code><=</code> models exactly that (evaluate everything first, then update everything).</p><p><b>Combinational logic (<code>always @(*)</code>): use <code>=</code>.</b></p><p><b>Mixing them in one block</b> (comprehensive 2025 Q3): <code>P <= a+b; Q = P + 2*c; R <= Q + 3*c;</code> at a clock edge, Q uses the <b>old</b> P (P's update is still pending), but R uses the <b>new</b> Q (the blocking assignment already happened). With 4-bit regs everything also wraps mod 16. Track each variable as "current" and "pending" exactly like the stepper.</p>`)}

  const drawT = () => { tl.innerHTML = ''; new Timing(tl, { steps: hist.length, cw: 34, rh: 40, signals: sigs.map((s, i) => ({ name: s[0], vals: hist.map(h => h[i]), cls: s[2] || '' })), marks: [] }); };

}
function crossLatch(c, type, top, bot, xg = 200, y1 = 60, y2 = 180, qInit = 0) {
  // top gate: inputs [top, Qfb]; bottom: [Qfb2, bot]
  c.gate('G1', type, xg, y1, { init: qInit }); c.gate('G2', type, xg, y2, { init: 1 - qInit });
  c.wire(top, 'G1.0'); c.wire(bot, 'G2.1');
  const ox = xg + 46 + 8 + 8;
  c.wire('G1', 'G2.0', { pts: [[ox + 22, y1], [ox + 22, y1 + 40], [xg - 30, y2 - 40], [xg - 30, y2 - 9]] });
  c.wire('G2', 'G1.1', { pts: [[ox + 22, y2], [ox + 22, y2 - 40], [xg - 30, y1 + 40], [xg - 30, y1 + 9]] });
  c.dot(ox + 22, y1, 'G1'); c.dot(ox + 22, y2, 'G2');

}

<h3>1. Combinational vs sequential</h3>
<p>A <b>sequential</b> circuit's output depends on the present inputs <b>and on its stored state</b> (its memory of the past). Examples from lecture 16: a counter, a vending machine, a traffic light controller, a keyboard buffer. Structure: a combinational circuit plus memory elements whose outputs feed back into it.</p>
<svg viewBox="0 0 520 170" width="520" style="max-width:100%;display:block;margin:10px auto">
<rect x="160" y="20" width="200" height="60" rx="8" class="blk"/><text x="260" y="55" text-anchor="middle" class="lbl">Combinational circuit</text>

<h3>2. The simplest memory, and how to make it writable</h3>
<p>Two inverters in a loop hold a value forever: if the first outputs 1, the second outputs 0, which keeps the first at 1. But there is no way to change it. Replace each inverter by a <b>NOR gate</b> with a spare input: now the spare inputs S (set) and R (reset) can force the loop. That is the <b>SR latch</b>.</p>
${W('w-sr', 'NOR SR latch, one gate delay at a time', 'Switches do not settle instantly here: after changing S or R, press "1 gate delay" to watch the change travel. The timeline records every step.')}
${box('key', 'The four input cases (NOR latch)', `<p><b>S = 0, R = 0: hold.</b> Each NOR has one input 0, so it acts as an inverter of the other gate's output: the two inverters in a loop keep whatever was stored.</p><p><b>S = 1, R = 0: set.</b> S = 1 forces Q' = 0 (one delay), then the top NOR sees R = 0 and Q' = 0 and outputs Q = 1 (second delay). Q changes <b>two gate delays</b> after S.</p><p><b>S = 0, R = 1: reset.</b> Mirror image: Q = 0 then Q' = 1.</p><p><b>S = 1, R = 1: forbidden.</b> Both NORs output 0, so Q = Q' = 0, which breaks the promise that Q' is the complement of Q.</p>`)}
${box('trap', 'Why SR = 11 is really forbidden (lecture 16: "Really?")', `<p>SR = 11 itself is stable (Q = Q' = 0). The disaster is what happens <b>next</b>: if S and R both return to 0 at the same instant, both NORs see 0, 0 and both switch to 1 after one delay; then both see a 1 and switch to 0; and so on. The latch <b>oscillates</b> (or, in a real chip, settles randomly depending on which gate is slightly faster: a race). Press the "SR = 11 then both → 0" preset and step it.</p>`)}
${W('w-nand', 'S\'R\' latch built from NAND gates (active-low inputs)', 'NAND version: the inputs are active LOW. S\' = 0 sets, R\' = 0 resets, S\'R\' = 11 holds, S\'R\' = 00 is forbidden (both outputs 1).')}
<h3>3. Adding a control (enable) input</h3>
<p>We want the latch to listen to S and R only at chosen times. Put two NAND gates in front, both driven by a control C: when C = 0 their outputs are 1, 1 (the NAND latch's "hold"); when C = 1 they pass S and R through (inverted, which suits the active-low NAND latch).</p>
${W('w-gsr', 'Gated SR latch (Tutorial 6 Q2): count the delays', 'Preset: S = 1, R = 0, Q = 0, then C rises at t = 0. Every gate has delay Δ. Count how many steps until Q first changes and until everything is stable.')}
${box('exam', 'Tutorial 6 Q2 and Q3(a) answered by the simulation', `<p>After C rises: the front NAND (SC)' falls at <b>Δ</b>; Q rises at <b>2Δ</b>; Q' falls at <b>3Δ</b>; stable from 3Δ. When C falls back to 0 later, the front gates both output 1, which is the hold condition, so Q does <b>not</b> change: the value is latched.</p><p>Minimum pulse width: C must stay high until the feedback has taken over, i.e. until Q' has changed (about 3Δ). If C drops earlier, Q may have risen while Q' has not yet fallen, and when C drops the latch can fall back to the old value or oscillate. So the pulse must be at least ~3Δ wide.</p>`)}
<h3>4. The D latch: no forbidden input</h3>
<p>Feed S = D and R = D' into the gated latch. Now S and R can never both be 1. When C = 1 the output simply follows D (the latch is <b>transparent</b>); when C = 0 it holds the last value. This is the building block of flip-flops.</p>
${W('w-dl', 'D latch at gate level')}

<h3>2. Master-slave D flip-flop: two latches, opposite enables</h3>
<p>Lecture 17's D flip-flop: a D latch (the <b>master</b>) followed by an SR latch (the <b>slave</b>, fed by Q and Q' of the master). The master is enabled when C = 0 (through an inverter); the slave when C = 1. So they are <b>never open at the same time</b>:</p>

function analyzeSeq(sp) {
  const nb = sp.st.length, ni = sp.ins.length, vars = [...sp.st, ...sp.ins];
  const fi = []; sp.st.forEach(b => ffInNames(sp.type, b).forEach((nm, t) => fi.push({ nm, bit: b, key: FF[sp.type].ins[t], f: exprFn(sp.eqs[nm] || '0', vars).f })));
  const of = Object.entries(sp.outs || {}).map(([nm, e]) => ({ nm, f: exprFn(e, vars).f }));
  const rows = [];
  for (let ps = 0; ps < (1 << nb); ps++) for (let x = 0; x < (1 << ni); x++) {
    const idx = (ps << ni) | x; const vals = {}; fi.forEach(g => vals[g.nm] = g.f(idx));
    let ns = 0; sp.st.forEach((b, j) => { const q = (ps >> (nb - 1 - j)) & 1; const iv = {}; fi.filter(g => g.bit === b).forEach(g => iv[g.key] = vals[g.nm]); let qn = FF[sp.type].next(iv, q); if (qn === null) qn = q; ns |= qn << (nb - 1 - j); });
    rows.push({ ps, x, fi: vals, ns, out: of.map(o => o.f(idx)) });
  }
  const mealy = of.length && ni && rows.some(r => rows.some(r2 => r2.ps === r.ps && r2.x !== r.x && r2.out.join() !== r.out.join()));
  return { rows, fi, of, mealy, nb, ni };
}
function seqDiagram(host, sp, A, o = {}) {
  const nb = sp.st.length, N = 1 << nb; const w = o.w || 460, h = o.h || 360;

  else pos = StateDiagram.circleLayout(range(N), w, h, 70);
  const states = range(N).map(s => { const r = A.rows.find(r => r.ps === s); return { id: s, label: bstr(s, nb), x: pos[s][0], y: pos[s][1], sub: !A.mealy && A.of.length ? '/' + r.out.join('') : undefined, unused: o.unused && o.unused.includes(s) }; });

}

function detDiagram(host, det, w = 540, h = 380) {

}

<h3>2. Sequence detectors: what to remember</h3>
<p>A sequence recogniser (lecture 20) has one serial input X (one bit per clock) and an output Z that says "the pattern has just arrived". For 1001 it must remember <b>how much of the pattern it has seen so far</b>: nothing useful (A), "1" (B), "10" (C), "100" (D). Each state = the longest prefix of the pattern that matches the end of the input so far.</p>

<h3>5. State reduction (brief)</h3>

  html: `
<h3>1. Ripple (asynchronous) counter</h3>
<p>Watch a binary count: bit 0 toggles every step; bit 1 toggles whenever bit 0 goes from 1 to 0; bit 2 whenever bit 1 goes from 1 to 0; and so on. So use T flip-flops with T = 1 (always toggle) and clock each one from the <b>previous flip-flop's output</b>. With negative-edge flip-flops, a 1 → 0 fall on Q<sub>i</sub> is exactly the "carry" that should toggle Q<sub>i+1</sub>.</p>
${W('w-rip', '4-bit ripple counter (negative-edge T flip-flops, T = 1)', 'Press Clock pulse. Each flip-flop has one unit of delay, so on 0111 → 1000 you can watch the change ripple through every stage, passing through wrong intermediate counts.')}
${W('w-riptd', 'Ripple counter timing with flip-flop delay', 'Every flip-flop waits one delay after its own clock falls. Red bands: moments when the outputs show a count that is not the real one (transient states).')}
${box('trap', 'The price of rippling', `<p>The last flip-flop changes only after n flip-flop delays. During that time the outputs pass through false values (0111 → 0110 → 0100 → 0000 → 1000). Anything that decodes the count (a decoder, a comparator) can see a <b>glitch</b>. And the clock must be slow enough that the ripple finishes before the next edge: <b>f<sub>max</sub> = 1 / (n × t<sub>pd</sub>)</b> for an n-bit ripple counter (plus the time for any decoding logic).</p><p>Comprehensive 2025 Q5: cascaded BCD ripple counters counting 0 to 999, 4 ns per flip-flop. To find the slowest transition, count how many flip-flop delays in a row the change must pass through: a carry from the units digit clocks the tens, which clocks the hundreds. Compare candidate transitions such as 099 → 100, 799 → 800 and 999 → 000, tracing which flip-flops change one after another. The maximum input frequency is 1 / (that total delay).</p>`)}
<h3>2. Synchronous counter: one clock for everybody</h3>
<p>All flip-flops share the same clock, so they change together, one flip-flop delay after the edge, with no rippling. The logic decides <i>who</i> toggles: bit i must toggle exactly when all lower bits are 1. With T flip-flops: <b>T<sub>0</sub> = 1, T<sub>1</sub> = Q<sub>0</sub>, T<sub>2</sub> = Q<sub>0</sub>Q<sub>1</sub>, T<sub>3</sub> = Q<sub>0</sub>Q<sub>1</sub>Q<sub>2</sub></b> (an AND chain, the same "all lower bits are 1" condition as a carry). Add a count-enable EN into every AND and T<sub>0</sub> = EN.</p>
${W('w-sync', '4-bit synchronous binary counter (T flip-flops + AND chain)', 'All flip-flops are clocked together. The glowing AND outputs show which flip-flops will toggle at the next edge.')}
${box('key', 'Variants you should be able to write down', `<p><b>Down counter:</b> bit i toggles when all lower bits are 0: T<sub>i</sub> = Q<sub>0</sub>'Q<sub>1</sub>'…Q<sub>i−1</sub>'.</p><p><b>Up/down counter</b> with control U: T<sub>i</sub> = U·(Q<sub>0</sub>…Q<sub>i−1</sub>) + U'·(Q<sub>0</sub>'…Q<sub>i−1</sub>').</p><p><b>Counter with parallel load:</b> a 2:1 mux in front of each flip-flop chooses between "load input" and "count" (see the register chapter).</p><p><b>Mod-N / BCD counter:</b> either design it with the procedure below (sequence 0..N−1, unused states X), or detect N and reset. <b>Synchronous</b> reset (through the logic, at the next edge) is clean. <b>Asynchronous</b> reset (through CLR) makes the counter briefly enter state N, which is a glitch.</p>`)}

<p>"Design a counter that counts 4-2-1-0-5-3 and repeats" (Midsem 2024 Q1) is just the design procedure with no input: the next state of 4 is 2, of 2 is 1, and so on. States not in the sequence (here 6 and 7) are don't-cares. Choose flip-flop types, use their excitation tables, K-map, done.</p>
${W('w-cnt', 'Counter designer', 'Enter the sequence (decimal), pick the flip-flop type for each bit (A is the MSB). The tool builds the excitation table, K-maps, equations, checks the unused states for lock-out, and draws the actual state diagram. Press Clock to step through it.')}

<h3>2. Shift registers</h3>
<p>Connect each flip-flop's Q to the next flip-flop's D. At every clock edge, every bit moves one place: the first flip-flop takes the serial input, the last bit falls out as the serial output. Because all flip-flops sample at the same edge (non-blocking, remember the Verilog chapter), each one captures its neighbour's <i>old</i> value: a true shift.</p>

<table class="tt"><tr><th></th><th>Ring counter</th><th>Johnson (twisted-ring) counter</th></tr><tr><td>feedback</td><td>last Q → first D</td><td>last Q' → first D</td></tr><tr><td>states with n flip-flops</td><td>n (one-hot: 1000, 0100, 0010, 0001)</td><td>2n (0000, 1000, 1100, 1110, 1111, 0111, 0011, 0001)</td></tr><tr><td>decoding a state</td><td>no gate needed (each state is one flip-flop)</td><td>one 2-input AND per state</td></tr><tr><td>start-up</td><td>must be initialised (preset one 1)</td><td>must start in a valid state</td></tr></table>

CH.push({
  id: 'systems', part: 'Part 4 · Sequential Circuits', title: 'System design: how exam problems combine the blocks',

  builds: ['codes', 'kmap', 'nandnor', 'decoder', 'mux', 'counters', 'registers', 'design'], leads: ['traps'],
  html: `
<h3>1. The lighthouse lamp controller (Midsem 2025 Task A)</h3>
<p><b>Story:</b> a lamp rotates; a converter gives its angle as a 3-bit <b>Gray code</b> XYZ (one code per 45° sector, counter-clockwise from east). Input W = weather. Good weather (W = 0): ON for 90°, OFF for 90°, starting ON at 0°. Bad weather (W = 1): ON/OFF every 45°, starting ON. From 180° to 270° the lamp faces land: <b>don't care</b>.</p>
${W('w-lh', 'Live lighthouse', 'The lamp sweeps around. The inner rings are the Gray code disk. Flip W. In the land sector the lamp does whatever the minimal circuit happens to produce: that is what "don\'t care" means in practice.')}
<h4>Translating the story into a truth table (the step that decides the whole question)</h4>
<ol><li>List the sectors in <b>physical order</b> with their Gray codes: 0–45° = 000, 45–90° = 001, 90–135° = 011, 135–180° = 010, 180–225° = 110, 225–270° = 111, 270–315° = 101, 315–360° = 100.</li>
<li>Write L for each sector for W = 0 and for W = 1 from the story.</li>
<li>Now place each row in the K-map by its <b>binary value</b> WXYZ (e.g. W = 1 and code 011 is minterm 1011 = 11).</li></ol>
${W('w-lhtt', 'Truth table (physical order) → minterms')}
${W('w-lhkm', 'K-map for L (variables W, X, Y, Z). Press "Group the 0s" for the POS the question asked for.')}
${box('exam', 'What the paper asked, and how each part maps to a chapter', `<p>A1 truth table → <span class="chip" data-go="codes">Gray code</span> + <span class="chip" data-go="canon">minterms</span>. A2 K-map. A3 PIs and EPIs of <b>L'</b> "in product form" (groups of 0s, written as products because they are terms of L') and the minimal POS → <span class="chip" data-go="kmap">K-maps</span>. A4 "minimum number of 2-input NOR gates, true and complement inputs available" → <span class="chip" data-go="nandnor">NOR-NOR with factoring</span>.</p>`)}

<h3>2. Detecting transmission errors (Midsem 2025 Task B)</h3>
<p>The Gray code is sent once per clock. Between clocks the code either stays the same or advances one step, and a Gray step changes exactly <b>one</b> bit. Lightning can flip at most one bit in transit. Idea: <b>remember the previous code in three D flip-flops</b> (a one-clock delay), XOR it with the new code to get the <b>difference vector</b> d<sub>2</sub>d<sub>1</sub>d<sub>0</sub> (which bits changed). A legal step changes 0 or 1 bits. If 2 or 3 bits changed, something went wrong: z = 1.</p>
${W('w-err', 'B1: D flip-flops + XOR gates + 3-to-8 decoder + 4-input OR', 'Set the incoming code and press Clock to store it as "previous". Then change the incoming code by one Gray step (fine) or by two bits (error).')}
${box('why', 'Why decoder outputs 3, 5, 6, 7', `<p>The decoder turns d<sub>2</sub>d<sub>1</sub>d<sub>0</sub> into one active line. Lines 3 (011), 5 (101), 6 (110) and 7 (111) are exactly the difference vectors with two or more 1s. OR them: z = m<sub>3</sub> + m<sub>5</sub> + m<sub>6</sub> + m<sub>7</sub> = the <b>majority</b> function of d<sub>2</sub>, d<sub>1</sub>, d<sub>0</sub>.</p><p><b>B2</b> replaces the decoder and OR with one 2:1 MUX, one AND and one OR: majority = d<sub>0</sub>'·(d<sub>2</sub>d<sub>1</sub>) + d<sub>0</sub>·(d<sub>2</sub> + d<sub>1</sub>). So put d<sub>0</sub> on the mux select, the AND of d<sub>2</sub>, d<sub>1</sub> on input 0 and the OR on input 1. (If d<sub>0</sub> = 0 you need both others; if d<sub>0</sub> = 1 you need just one more.) This is the mux "variable on the select" method from <span class="chip" data-go="mux">Multiplexers</span>.</p><p><b>Honest limitation:</b> a single flipped bit when the code did not advance looks like a legal step, so not every error is detectable this way. Task C fixes that with a state machine that knows which bit is allowed to change next (see <span class="chip" data-go="design">Sequential design</span>).</p>`)}

<h3>3. "Detect 1001, and stop after ten detections" (Midsem 2024 Q5)</h3>
<p>Instead of designing a state machine, combine catalogue parts: a <b>serial-in parallel-out shift register</b> keeps the last four bits; a <b>decoder</b> spots the pattern 1001 on those four bits (output 9) = Z<sub>1</sub>; a <b>counter</b> with enable counts the Z<sub>1</sub> pulses; a <b>demultiplexer</b> (or decoder) on the counter outputs spots count 10 = Z<sub>2</sub>, which disables the shift register (active-low enable) so the operation stops.</p>
${W('w-ten', 'Block-level system, live', 'Set X and press Clock, or press "Feed 1001001001..." to auto-play. Overlapping detections are natural here: the shift register always holds the last four bits.')}
${box('key', 'Pattern for "system" questions', `<p>1. Name the sub-tasks in the story (remember history, recognise a value, count events, compare, stop). 2. Map each to a catalogue block (shift register, decoder, counter, comparator, enable). 3. Draw the data path first, then the control/enable wiring. 4. Check polarities (active-low enables!) and what happens on the clock edge where the condition first becomes true.</p>`)}

  html: `
<h3>Numbers and codes</h3>
<ul>
<li>n bits: 2<sup>n</sup> patterns; unsigned 0 … 2<sup>n</sup>−1; 2's complement −2<sup>n−1</sup> … 2<sup>n−1</sup>−1. To store N things you need ⌈log<sub>2</sub>N⌉ bits. <span class="chip" data-go="numbers">ch</span></li>
<li>2's complement: MSB weight is −2<sup>n−1</sup>. Negate = invert + 1. Negating the most negative number gives itself. Sign-extend by copying the MSB. <span class="chip" data-go="signed">ch</span></li>
<li>Unsigned add: overflow ⇔ C<sub>n</sub> = 1. Unsigned subtract (A + B' + 1): C<sub>n</sub> = 1 means no borrow (A ≥ B); C<sub>n</sub> = 0 means the result is the 2's complement of B − A. Signed: V = C<sub>n−1</sub> ⊕ C<sub>n</sub>; mixed-sign additions never overflow.</li>
<li>Bit-width detective: a wrong output = true value mod 2<sup>n</sup> (then re-read as signed if signed). Use a correct row for a lower bound and a wrong row for the modulus. <span class="chip" data-go="rca">ch</span></li>
<li>BCD: codes 1010–1111 never occur → d(10…15). Excess-3 = n + 3, self-complementing. Gray: one bit changes, including the wrap; g<sub>i</sub> = b<sub>i+1</sub>⊕b<sub>i</sub>; b<sub>i</sub> = b<sub>i+1</sub>⊕g<sub>i</sub> (cascaded). Gray is not weighted. <span class="chip" data-go="codes">ch</span></li>
<li>Gray-coded inputs: list rows in physical (Gray) order, place them in the K-map by binary value.</li>
<li>Parity: XOR of all bits. Even parity generator P = d<sub>3</sub>⊕d<sub>2</sub>⊕d<sub>1</sub>⊕d<sub>0</sub>. Detects any odd number of flipped bits, misses even numbers.</li>
</ul>
<h3>Boolean algebra and forms</h3>
<ul>
<li>(AB)' = A' + B'; (A+B)' = A'B'. x + xy = x; x + x'y = x + y; x + yz = (x+y)(x+z); consensus xy + x'z + yz = xy + x'z. <span class="chip" data-go="gates">ch</span></li>
<li>Minterm m<sub>i</sub>: 0 → primed. Maxterm M<sub>i</sub>: 1 → primed. M<sub>i</sub> = m<sub>i</sub>'. Σm(list) = ΠM(complementary list). F' = Σm(0-rows). <span class="chip" data-go="canon">ch</span></li>
<li>The first variable in F(A,B,C,D) is the MSB of the minterm number. Always check the order the question uses.</li>
</ul>

<ul>
<li>4-variable cell numbers: row 00: 0 1 3 2 · row 01: 4 5 7 6 · row 11: 12 13 15 14 · row 10: 8 9 11 10. <span class="chip" data-go="kmap">ch</span></li>
<li>Groups: rectangles of 1, 2, 4, 8, 16; may wrap edges and corners; as large as possible; as few as possible.</li>
<li>PI = cannot be enlarged. EPI = the only PI covering some 1. Don't-cares never make a PI essential and groups of only X are never used or listed.</li>
<li>POS: group 0s → F' in SOP → De Morgan each term. With don't-cares, MSP and MPS may assign X's differently (Tutorial 4 Q1).</li>
<li>Cyclic maps have no EPIs and several minimal answers: list them all if asked.</li>
<li>5 variables: two 4-variable maps (A = 0, A = 1); same cell in both maps = adjacent.</li>
<li>QM: include don't-cares when merging, exclude them from the PI chart columns. <span class="chip" data-go="qm">ch</span></li>
</ul>

<ul>
<li>SOP → NAND-NAND; POS → NOR-NOR. Single-literal terms need the complement at the second level. <span class="chip" data-go="nandnor">ch</span></li>
<li>Counts with NAND: NOT 1, AND 2, OR 3 (1 if complements are free), XOR 4. With NOR: NOT 1, OR 2, AND 3, XNOR 4.</li>
<li>For "2-input gates only": factor first, share subterms, then push bubbles and count.</li>
</ul>
<h3>Arithmetic blocks</h3>
<ul>
<li>HA: S = A⊕B, C = AB. FA: S = A⊕B⊕C<sub>in</sub>, C<sub>out</sub> = AB + AC<sub>in</sub> + BC<sub>in</sub> = AB + C<sub>in</sub>(A⊕B). FA = 2 HA + OR. <span class="chip" data-go="adders">ch</span></li>

<ul>

<li>Only true inputs available: a decoder is a free source of complemented products of its inputs.</li>
<li>Demux = decoder with the data on the enable.</li>
<li>ROM = fixed AND (decoder) + programmable OR; PLA = both programmable, size inputs × terms × outputs, minimise the number of distinct shared terms; PAL = programmable AND, fixed OR. <span class="chip" data-go="pld">ch</span></li>
</ul>
<h3>Verilog</h3>
<ul>
<li>Gate primitive: output first. Structural and assign statements are concurrent: line order does not matter. <span class="chip" data-go="verilog">ch</span></li>

<li>Characteristic: D: Q<sup>+</sup> = D. T: Q<sup>+</sup> = T⊕Q. JK: Q<sup>+</sup> = JQ' + K'Q. SR: Q<sup>+</sup> = S + R'Q. <span class="chip" data-go="ffTypes">ch</span></li>

</ul>
<h3>Counters and registers</h3>
<ul>
<li>Ripple counter: T = 1, each FF clocked by the previous Q (negative-edge); transient wrong states; f<sub>max</sub> = 1/(n·t<sub>pd</sub>). <span class="chip" data-go="counters">ch</span></li>
